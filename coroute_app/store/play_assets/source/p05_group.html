<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css"><script src="common.js"></script>
<style>
.warn{position:absolute;left:14px;right:14px;top:40px;z-index:6;background:var(--accentSoft);border:1px solid var(--accentBorder);border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:center;box-shadow:0 4px 16px var(--shadow)}
.warn .ic{width:40px;height:40px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;color:var(--accent)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:20px 20px 0 0;box-shadow:0 -4px 16px var(--shadow);padding:10px 18px 30px;z-index:7}
.handle{width:36px;height:4px;border-radius:2px;background:var(--borderStrong);margin:0 auto 14px}
.gap{position:absolute;z-index:5;transform:translate(-50%,-50%);height:28px;padding:0 12px;border-radius:999px;background:var(--surface);border:1.5px solid var(--accent);color:var(--accentStrong);font-size:13px;font-weight:700;display:flex;align-items:center;box-shadow:0 2px 8px var(--shadow)}
.pin{position:absolute;z-index:5;transform:translate(-50%,-100%)}
</style></head><body>
<div class="panel teal" id="panel">
  <div class="head"><h1>Never lose<br>your group</h1><div class="sub">Know when someone falls behind</div></div>
  <div class="phone"><div class="glass"><div class="screen" id="scr">
    <div id="map" style="position:absolute;inset:0"></div>
    <div class="warn"><div class="ic" id="wi"></div><div style="flex:1"><div style="font-size:16px;font-weight:600;color:var(--text)">Kiran fell behind · 1.2 km</div><div style="font-size:13px;color:var(--accentStrong);font-weight:500">Ravi (sweeper) has been told</div></div></div>
    <div class="sheet"><div class="handle"></div>
      <div class="row"><div style="width:44px;height:44px;border-radius:12px;background:var(--primarySoft);color:var(--primary);display:flex;align-items:center;justify-content:center" id="fi"></div>
        <div style="flex:1"><div class="label">Regroup point</div><div style="font-size:17px;font-weight:600">Fuel stop, Devanahalli</div></div><div style="text-align:right"><div style="font-size:17px;font-weight:700">2.4 km</div><div class="caption">ahead</div></div></div>
      <div class="row" style="margin-top:14px;gap:8px"><span class="chip tint">4 of 5 heading there</span><span class="chip">Kiran: 6 min away</span></div>
      <div class="row" style="margin-top:16px;gap:10px"><div class="btn primary" style="flex:1" id="nv"></div></div>
    </div>
  </div></div></div>
</div>
<script>
CR.ready(async () => {
  CR.deco(document.getElementById('panel'), 'teal'); const scr = document.getElementById('scr'); CR.chrome(scr);
  const I = CR.icon; wi.innerHTML = I('alert', 22); fi.innerHTML = I('flag', 24); nv.innerHTML = I('nav', 18) + 'Navigate';
  const m = CR.makeMap(document.getElementById('map'), {
    w: 412, h: 898, seed: 21, gridAngle: -14, gridStep: 46,
    route: [[120, 960], [110, 820], [170, 700], [250, 600], [236, 470], [170, 360], [210, 240], [300, 150], [340, -30]],
    major: [[[-20, 560], [140, 600], [250, 600], [430, 640]]],
    towns: [[320, 300, 95], [70, 720, 80]], parks: [[80, 420, 55], [340, 760, 50]], lake: [60, 200, 40],
    river: [[440, 420], [330, 450], [250, 520], [180, 500], [-20, 540]], riverW: 13,
    labels: [[320, 238, 'Devanahalli', 13, 600], [80, 650, 'Sadahalli', 12, 600]], country: 6,
  });
  const C = CR.MEMBERS.light;
  // regroup flag
  const fp = CR.onPath(m.path, CR.atY(m.path, 168));
  m.layer.insertAdjacentHTML('beforeend', `<div class="pin" style="left:${fp.x}px;top:${fp.y}px"><svg width="40" height="48" viewBox="0 0 40 48"><path d="M20 47C20 47 4 30 4 18a16 16 0 0 1 32 0c0 12-16 29-16 29z" fill="#2B7A8C" stroke="#fff" stroke-width="2.5"/><g transform="translate(9 7) scale(.92)" style="color:#fff">${CR.ICON_FLAG || ''}</g></svg></div>`);
  m.layer.lastChild.querySelector('g').innerHTML = '<path d="M5 21V4M5 4h12l-2.5 4L17 12H5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>';
  const group = [
    { y: 260, type: 'adventure', color: C[0], name: 'Asha', role: 'L', tag: 'right' },
    { y: 330, type: 'cruiser', n: 2, color: C[3], name: 'Arjun', tag: 'left' },
    { y: 400, type: 'retro', color: C[7], name: 'Meera', tag: 'right' },
    { y: 468, type: 'offroad', color: C[1], name: 'Ravi', role: 'S', tag: 'left' },
  ];
  group.forEach(r => { const p = CR.onPath(m.path, CR.atY(m.path, r.y)); CR.rider(m.layer, { ...p, ...r, size: 74, tagOff: .3 }); });
  // gap: dashed amber segment between Ravi and Kiran
  const L = m.path.getTotalLength(); const f1 = CR.atY(m.path, 498), f2 = CR.atY(m.path, 628);
  const ns = 'http://www.w3.org/2000/svg'; const seg = document.createElementNS(ns, 'path'); seg.setAttribute('d', m.path.getAttribute('d'));
  seg.setAttribute('fill', 'none'); seg.setAttribute('stroke', '#D9822B'); seg.setAttribute('stroke-width', '6'); seg.setAttribute('stroke-linecap', 'round');
  const lo = Math.min(f1, f2), hi = Math.max(f1, f2); const a = L * lo, b = L * hi; seg.setAttribute('stroke-dasharray', `0 ${a} ${b - a} ${L}`); m.svg.appendChild(seg);
  const seg2 = seg.cloneNode(); seg2.setAttribute('stroke', '#fff'); seg2.setAttribute('stroke-width', '2.5'); seg2.setAttribute('stroke-dasharray', `0 ${a} ` + Array(30).fill('7 7').join(' ')); seg2.setAttribute('stroke-dashoffset', '0');
  const mid = CR.onPath(m.path, (f1 + f2) / 2);
  m.layer.insertAdjacentHTML('beforeend', `<div class="gap" style="left:${mid.x + 62}px;top:${mid.y}px">1.2 km gap</div>`);
  const k = CR.onPath(m.path, lo - 0.004); CR.rider(m.layer, { ...k, type: 'sport', color: C[4], name: 'Kiran', tag: 'left', size: 74, tagOff: .3 });
});
</script></body></html>
