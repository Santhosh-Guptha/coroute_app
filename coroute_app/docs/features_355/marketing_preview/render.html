<html><head><meta charset="utf-8">

</head><body>

<script>
// Visual check only: a JS mirror of lib/presentation/admin/marketing/marketing_painter.dart.
const col = (h) => { if (!h) return 'transparent'; const r = parseInt(h.slice(1,3),16), g = parseInt(h.slice(3,5),16), b = parseInt(h.slice(5,7),16); const a = h.length > 7 ? parseInt(h.slice(7,9),16)/255 : 1; return `rgba(${r},${g},${b},${a})`; };

}

  ctx.fillStyle = '#0B0F14'; rr(ctx, 0, 0, 100, 100, 22); ctx.fill();

  ctx.strokeStyle = '#3EE0EC'; ctx.lineWidth = 15; ctx.lineCap = 'round'; ctx.beginPath(); road(); ctx.stroke();
  ctx.lineCap = 'butt'; dashed(ctx, 4.5, 4.5, '#0B0F14', 2.2, road);

function render(data) {

  const c = document.getElementById('c'); c.width = W; c.height = H; const ctx = c.getContext('2d');

    const box = { x: -bw/2, y: -bh/2, w: bw, h: bh };

      drawLines(ctx, f, box, l.align, col(l.color), l.shadow ? { c: col(l.shadow.color), b: l.shadow.blur*u, dx: l.shadow.dx*u, dy: l.shadow.dy*u } : null);
    } else if (l.type === 'shape') {
      ctx.fillStyle = col(l.fill); ctx.beginPath();
      if (l.shape === 'burst' || l.shape === 'star') { const n = l.shape === 'star' ? 5 : 16, inner = l.shape === 'star' ? 0.45 : 0.8; for (let i = 0; i < n*2; i++) { const a = -Math.PI/2 + i*Math.PI/n, k = i % 2 ? inner : 1; const x = Math.cos(a)*bw/2*k, y = Math.sin(a)*bh/2*k; i ? ctx.lineTo(x,y) : ctx.moveTo(x,y); } ctx.closePath(); }
      else if (l.shape === 'circle') ctx.ellipse(0,0,bw/2,bh/2,0,0,7);
      else if (l.shape === 'pill') ctx.roundRect(box.x, box.y, bw, bh, Math.min(bw,bh)/2);
      else if (l.shape === 'ribbon') { const d = bh*0.38; ctx.moveTo(box.x, box.y); ctx.lineTo(box.x+bw, box.y); ctx.lineTo(box.x+bw-d, 0); ctx.lineTo(box.x+bw, box.y+bh); ctx.lineTo(box.x, box.y+bh); ctx.lineTo(box.x+d, 0); ctx.closePath(); }
      else ctx.roundRect(box.x, box.y, bw, bh, Math.min(l.radius*u, Math.min(bw,bh)/2));
      ctx.fill();
      const label = sub(l.label, v);
      if (label) {
        const ins = (l.shape === 'burst' || l.shape === 'circle') ? { x: -bw*0.35, y: -bh*0.3, w: bw*0.7, h: bh*0.6 } : (l.shape === 'ribbon' ? { x: box.x + bh*0.5, y: box.y + bh*0.12, w: bw - bh, h: bh*0.76 } : { x: box.x + Math.min(bw,bh)*0.12, y: box.y + Math.min(bw,bh)*0.12, w: bw - Math.min(bw,bh)*0.24, h: bh - Math.min(bw,bh)*0.24 });
        drawLines(ctx, fitText(ctx, label, ins, { size: l.labelSize*u, weight: l.weight, font: l.font, lh: 1, shrink: true }), ins, 'center', col(l.labelColor));
      }
    } else if (l.type === 'logo') {
      if (l.variant === 'mark') { const s = Math.min(bw,bh); mark(ctx, -s/2, -s/2, s); }
      else { let side = bh; ctx.font = `800 ${side*0.66}px Manrope`; let tw = ctx.measureText('CoRoute').width; let total = side*1.25 + tw; if (total > bw) { side *= bw/total; ctx.font = `800 ${side*0.66}px Manrope`; tw = ctx.measureText('CoRoute').width; total = side*1.25 + tw; }
        const left = -total/2; mark(ctx, left, -side/2, side); ctx.fillStyle = col(l.color); ctx.textBaseline = 'middle'; ctx.textAlign = 'left'; ctx.fillText('CoRoute', left + side*1.25, 0); }
    } else if (l.type === 'qr') {
      const side = Math.min(bw,bh), n = data.qr.length + 4, cell = side/n; ctx.fillStyle = col(l.background); rr(ctx, -side/2, -side/2, side, side, cell*1.2); ctx.fill(); ctx.fillStyle = col(l.color);
      data.qr.forEach((row, y) => [...row].forEach((b, x) => { if (b === '1') ctx.fillRect(-side/2 + (x+2)*cell, -side/2 + (y+2)*cell, cell+0.6, cell+0.6); }));
    } else if (l.type === 'coupon') {
      const minSide = Math.min(bw,bh); ctx.save(); ctx.shadowColor = 'rgba(0,0,0,0.35)'; ctx.shadowBlur = minSide*0.08; ctx.fillStyle = col(l.fill);
      if (l.style === 'pill') { rr(ctx, box.x, box.y, bw, bh, bh/2); ctx.fill(); }
      else if (l.style === 'ticket') { ctx.beginPath(); ctx.rect(box.x - bw, box.y - bh, bw*3, bh*3); ctx.moveTo(box.x + bh*0.1, 0); ctx.arc(box.x, 0, bh*0.1, 0, 7); ctx.moveTo(box.x + bw + bh*0.1, 0); ctx.arc(box.x+bw, 0, bh*0.1, 0, 7); ctx.clip('evenodd'); rr(ctx, box.x, box.y, bw, bh, minSide*0.09); ctx.fill(); }
      else if (l.style === 'stamp') { ctx.beginPath(); ctx.rect(box.x - bw, box.y - bh, bw*3, bh*3); const r = minSide*0.032, st = r*3.2; for (let x = box.x + st/2; x < box.x+bw; x += st) { ctx.moveTo(x+r, box.y); ctx.arc(x, box.y, r, 0, 7); ctx.moveTo(x+r, box.y+bh); ctx.arc(x, box.y+bh, r, 0, 7); } for (let y = box.y + st/2; y < box.y+bh; y += st) { ctx.moveTo(box.x+r, y); ctx.arc(box.x, y, r, 0, 7); ctx.moveTo(box.x+bw+r, y); ctx.arc(box.x+bw, y, r, 0, 7); } ctx.clip('evenodd'); ctx.fillRect(box.x, box.y, bw, bh); }
      else { rr(ctx, box.x, box.y, bw, bh, minSide*0.1); ctx.fill(); ctx.shadowColor = 'transparent'; ctx.save(); ctx.clip(); ctx.fillStyle = col(l.accent); ctx.fillRect(box.x, box.y, bw, bh*0.07); ctx.restore(); }
      ctx.restore();
      const head = sub(l.headline, v), code = sub(l.codeLine, v), foot = sub(l.footer, v);
      const chip = (cell, f) => { ctx.font = `800 ${f.s}px ${fam(l.font)}`; const w = Math.min(cell.w, ctx.measureText(f.lines[0]).width + cell.h*0.7); const r = { x: cell.x + (cell.w - w)/2, y: cell.y + cell.h*0.04, w, h: cell.h*0.92 }; ctx.fillStyle = alpha(l.accent, 0.15); rr(ctx, r.x, r.y, r.w, r.h, r.h*0.28); ctx.fill(); dashed(ctx, minSide*0.025, minSide*0.016, col(l.accent), Math.max(1, minSide*0.01), () => ctx.roundRect(r.x, r.y, r.w, r.h, r.h*0.28)); };
      if (l.style === 'pill') {
        const pad = bh*0.18; const inner = { x: box.x + pad*2, y: box.y + pad, w: bw - pad*4, h: bh - pad*2 };
        const parts = [head, code, foot].filter((p) => p.trim()); const shares = parts.length === 3 ? [0.3,0.42,0.28] : (parts.length === 2 ? [0.42,0.58] : [1]); let x = inner.x;
        parts.forEach((p, i) => { const cell = { x, y: inner.y, w: inner.w*shares[i], h: inner.h }; const d = cell.h*0.08; const ib = { x: cell.x+d, y: cell.y+d, w: cell.w-2*d, h: cell.h-2*d }; const isH = p === head, isC = p === code;
          const f = fitText(ctx, p, ib, { size: inner.h*(isH?0.8:(isC?0.5:0.4)), weight: isH||isC?800:600, font: l.font, lh: 1.05, shrink: true, maxLines: 1 }); if (isC) chip(cell, f); drawLines(ctx, f, ib, 'center', isH||isC ? col(l.textColor) : alpha(l.textColor, 0.72)); x += cell.w; });
      } else {
        const pad = minSide*0.11; const inner = { x: box.x + pad, y: box.y + pad, w: bw - 2*pad, h: bh - 2*pad };
        const hasFoot = !!foot.trim(), hHead = inner.h*(hasFoot?0.42:0.5), hCode = inner.h*0.32, gap = inner.h*0.04; let y = inner.y + (l.style === 'card' ? bh*0.04 : 0);
        if (head.trim()) { const r = { x: inner.x, y, w: inner.w, h: hHead }; drawLines(ctx, fitText(ctx, head, r, { size: hHead*0.92, weight: 800, font: l.font, lh: 1.05, shrink: true, maxLines: 2 }), r, 'center', col(l.style === 'stamp' ? l.accent : l.textColor)); }
        y += hHead + gap;
        if (l.style === 'ticket') dashed(ctx, minSide*0.03, minSide*0.022, alpha(l.accent, 0.8), Math.max(1, minSide*0.008), () => { ctx.moveTo(inner.x, y - gap/2); ctx.lineTo(inner.x + inner.w, y - gap/2); });
        if (code.trim()) { const r = { x: inner.x + inner.w*0.06, y: y + gap, w: inner.w*0.88, h: hCode - gap*2 }; const d = r.h*0.18; const ib = { x: r.x+d, y: r.y+d, w: r.w-2*d, h: r.h-2*d }; const f = fitText(ctx, code, ib, { size: r.h*0.55, weight: 800, font: l.font, lh: 1.05, shrink: true, maxLines: 1 }); chip(r, f); drawLines(ctx, f, ib, 'center', col(l.textColor)); }
        y += hCode;

window.render = render;
