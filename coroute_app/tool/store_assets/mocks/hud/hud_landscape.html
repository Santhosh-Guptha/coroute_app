.gpill { display:inline-flex; align-items:center; gap:8px; height:40px; border-radius:999px; padding:0 12px; background:#242932; border:1px solid #2F3540; font-size:13px; font-weight:600; }
.talk { height:56px; border-radius:14px; background:#1F3A40; display:flex; align-items:center; gap:12px; padding:0 16px; color:#5FB3C4; font-weight:600; font-size:15px; }

.av { width:36px; height:36px; border-radius:50%; color:#fff; font-weight:700; display:flex; align-items:center; justify-content:center; font-size:14px; }
.role { font-size:12px; font-weight:600; color:#5FB3C4; background:#1F3A40; border-radius:999px; padding:2px 8px; margin-left:8px; }
.navbar { position:absolute; bottom:6px; left:50%; width:120px; margin-left:-60px; height:4px; border-radius:2px; background:#E7E3DC; opacity:.5; z-index:9; }
