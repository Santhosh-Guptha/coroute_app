.talk { height:56px; border-radius:14px; background:#D7ECEF; display:flex; align-items:center; gap:12px; padding:0 16px; color:#2B7A8C; font-weight:600; font-size:15px; }

.av { width:36px; height:36px; border-radius:50%; color:#fff; font-weight:700; display:flex; align-items:center; justify-content:center; font-size:14px; }
.role { font-size:12px; font-weight:600; color:#2B7A8C; background:#D7ECEF; border-radius:999px; padding:2px 8px; margin-left:8px; }
