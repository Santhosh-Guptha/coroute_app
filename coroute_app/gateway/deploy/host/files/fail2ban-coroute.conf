# /etc/fail2ban/jail.d/coroute.conf (deploy/host/apply.sh, v3.56)
[DEFAULT]
bantime = 1h
bantime.increment = true
bantime.maxtime = 1w
findtime = 10m
maxretry = 5
backend = systemd
# Never ban the loopback or the VCN peer (filled in by apply.sh from inventory: IGNORE_IPS).
ignoreip = 127.0.0.1/8 ::1 __IGNORE_IPS__

[sshd]
enabled = true
mode = aggressive
