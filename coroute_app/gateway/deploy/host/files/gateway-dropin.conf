# /etc/systemd/system/coroute-gateway.service.d/10-v356.conf (deploy/host/apply.sh, v3.56)
[Service]
# SHUTDOWN_DRAIN_MS (15 s on vm1/vm2) + flushing rides and leases (<= 20 s) must fit before systemd kills it.
TimeoutStopSec=45
Restart=always
RestartSec=2
# Releases (deploy/release.sh) keep data outside the code directory.
ReadWritePaths=-/opt/coroute/shared/data
Environment=NODE_OPTIONS=--max-old-space-size=__HEAP_MB__
MemoryHigh=__MEM_HIGH__
MemoryMax=__MEM_MAX__
