# /etc/ssh/sshd_config.d/10-coroute-hardening.conf (deploy/host/apply.sh, v3.56)
# sshd uses the FIRST value it reads, and files here are read in name order: "10-" wins over the image's
# 50-cloud-init.conf and over any older 50-password-auth.conf. Keys only, no root, no passwords.
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
PermitEmptyPasswords no
MaxAuthTries 4
LoginGraceTime 30
X11Forwarding no
AllowAgentForwarding no
ClientAliveInterval 300
ClientAliveCountMax 2
