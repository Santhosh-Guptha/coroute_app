# /etc/sysctl.d/90-coroute.conf (deploy/host/apply.sh, v3.56). Tuned for a 1 GB OCI micro holding a few thousand
# WebSockets behind Caddy; harmless on the A1 worker. tcp_tw_recycle does not exist any more (Linux >= 4.12): never set it.
vm.swappiness=10
vm.vfs_cache_pressure=50
fs.file-max=262144
net.core.somaxconn=4096
net.core.netdev_max_backlog=4096
net.ipv4.tcp_max_syn_backlog=4096
net.ipv4.ip_local_port_range=10240 65535
net.ipv4.tcp_tw_reuse=1
net.ipv4.tcp_fin_timeout=15
net.ipv4.tcp_keepalive_time=120
net.ipv4.tcp_keepalive_intvl=30
net.ipv4.tcp_keepalive_probes=4
# Long-lived sockets that send in bursts: no slow start after idle, little unsent data buffered in the kernel.
net.ipv4.tcp_slow_start_after_idle=0
net.ipv4.tcp_notsent_lowat=16384
# Small minimums so thousands of idle sockets stay cheap on 1 GB; the maximum still allows fast transfers.
net.ipv4.tcp_rmem=4096 87380 4194304
net.ipv4.tcp_wmem=4096 16384 4194304
net.core.default_qdisc=fq
