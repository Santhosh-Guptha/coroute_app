<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--
  Coroute page template. Not served (files starting with "_" are blocked).
  Copy to public/<page>.html, add the route to SITE_PAGES and SITEMAP in gateway/src/pages.js,
  then replace every PAGE_* value below. Rules: unique title and description per page,
  title as "Topic | Coroute" or "Coroute: Topic" (colon or pipe, never a dash), no em/en dashes, no emoji.
-->
<title>PAGE_TITLE | Coroute</title>
<meta name="description" content="PAGE_DESCRIPTION">
<link rel="canonical" href="__ORIGIN__PAGE_PATH">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Coroute">
<meta property="og:title" content="PAGE_TITLE | Coroute">
<meta property="og:description" content="PAGE_DESCRIPTION">
<meta property="og:url" content="__ORIGIN__PAGE_PATH">
<meta property="og:image" content="__ORIGIN__/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="CoRoute logo with the words: keep your group together on every ride">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="PAGE_TITLE | Coroute">
<meta name="twitter:description" content="PAGE_DESCRIPTION">
<meta name="twitter:image" content="__ORIGIN__/og-image.png">
<meta name="theme-color" content="#0B0D0E">
<meta name="color-scheme" content="dark">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="preload" href="/fonts/barlow-condensed-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/site.css">
<link rel="stylesheet" href="/assets/home.css">
<script>document.documentElement.classList.add('js')</script>
<script src="/assets/site.js" defer></script>
<!-- Optional page-only styles go here, in one <style> block, using the tokens from site.css. -->
</head>
<body data-page="PAGE_KEY">
<!--#include header-->
<main id="main" class="site-main" tabindex="-1">

  <section class="hm-hero hm-hero--page topo" aria-labelledby="hero-title">
    <div class="container">
      <div class="hm-hero__inner">
        <p class="eyebrow">PAGE_EYEBROW</p>
        <h1 id="hero-title">PAGE_HEADLINE</h1>
        <p class="t-lead">PAGE_LEAD</p>
        <div class="hm-hero__cta">
          <a class="btn btn--primary btn--lg" href="/get">Get the app</a>
          <a class="btn btn--secondary btn--lg" href="/checkout">See plans</a>
        </div>
      </div>
    </div>
  </section>

  <section class="section section--surface">
    <div class="container">
      <div class="hm-head">
        <p class="eyebrow">Section eyebrow</p>
        <h2>Section headline</h2>
        <p>One or two short sentences.</p>
      </div>
      <!-- content: use .hm-features, .hm-steps, .hm-facts or .hm-cta from home.css -->
    </div>
  </section>

</main>
<!--#include footer-->
</body>
</html>
