ong); stroke-width: 1.5; stroke-dasharray: 6 8; }.s-route { fill: none; stroke: var(--c-brand); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }.s-route--thin { stroke-width: 4; opacity: .9; }.s-t { fill: var(--c-text); font-size: 15px; font-weight: 800; }.s-t2 { fill: var(--c-text-3); font-size: 12px; font-weight: 600; }.s-t3 { fill: var(--c-text); font-size: 13px; font-weight: 700; }.s-tw { fill: #FFFFFF; font-size: 11px; font-weight: 800; }.s-big { fill: var(--c-text); font-size: 30px; font-weight: 800; }.s-huge { fill: var(--c-text); font-size: 44px; font-weight: 800; }.s-ax { fill: var(--c-text-3); font-size: 11px; font-weight: 600; }.s-ax--warn { fill: var(--c-safety-ink); }.s-brand { fill: var(--c-brand-fill); }.s-warn { fill: var(--c-rider-e); }.s-sos { fill: var(--c-sos); }.s-ok { fill: var(--c-success); }.s-off { fill: var(--c-border-strong); }.s-ringed, .s-ring { stroke: var(--c-surface); stroke-width: 3; }.s-ring { fill: var(--c-surface); }.s-hole { fill: var(--c-surface); }.s-tick { fill: none; stroke: #FFFFFF; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }.s-r0 { fill: var(--c-brand-fill); } .s-r1 { fill: var(--c-rider-c); } .s-r2 { fill: var(--c-rider-a); }.s-r3 { fill: var(--c-rider-d); } .s-r4 { fill: var(--c-rider-e); } .s-r5 { fill: #3E8E5E; }.s-tag { fill: var(--c-text); }.s-tag-t { fill: var(--c-bg); font-size: 9.5px; font-weight: 800; }.s-track { fill: var(--c-surface-2); }.s-bar { fill: var(--c-brand-light); stroke: var(--c-brand); stroke-width: 1; }.s-bar2 { fill: var(--c-surface-3); stroke: var(--c-border-strong); stroke-width: 1; }.s-wave { fill: var(--c-brand); }.s-wave-l { fill: none; stroke: var(--c-safety-ink); stroke-width: 2.5; stroke-linecap: round; }.s-arrow { fill: none; stroke: #FFFFFF; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }.s-sign { fill: #FFFFFF; stroke: #D32F2F; stroke-width: 6; }.s-sign-t { fill: #111111; font-size: 13px; font-weight: 800; }.s-pill-warn { fill: var(--c-safety-light); stroke: var(--c-safety-line); }.s-pill-ok { fill: var(--c-surface); stroke: var(--c-border); }.s-link { fill: none; stroke: var(--c-safety-ink); stroke-width: 2; stroke-dasharray: 3 5; stroke-linecap: round; }.s-link--sos { stroke: var(--c-sos); opacity: .6; }.s-cross { stroke: var(--c-sos); stroke-width: 2; stroke-linecap: round; }.s-pulse { fill: var(--c-safety-ink); stroke: var(--c-surface); stroke-width: 2; }.s-ripple { fill: none; stroke: var(--c-sos); stroke-width: 2; }.s-ring-track { fill: none; stroke: var(--c-surface-2); stroke-width: 8; }.s-ring-sos { fill: none; stroke: var(--c-sos); stroke-width: 8; stroke-linecap: round; }.s-gauge-track { fill: none; stroke: var(--c-surface-2); stroke-width: 22; stroke-linecap: round; }.s-gauge { fill: none; stroke: var(--c-rider-e); stroke-width: 22; stroke-linecap: round; }.s-limit { fill: none; stroke: var(--c-safety-ink); stroke-width: 1.5; stroke-dasharray: 5 4; }.s-line { fill: none; stroke: var(--c-brand); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }</style><g class="st-scene"><rect width="480" height="400" class="s-land"></rect><path d="M0 120 C 90 80, 170 140, 260 104 S 420 60, 480 96 V0 H0 Z" class="s-hill1"></path><path d="M0 400 V300 C 80 270, 150 320, 240 290 S 400 250, 480 280 V400 Z" class="s-hill2"></path><path d="M14 183.6 l13.2 28.799999999999997 h-26.4z" class="s-tree"></path><path d="M30 373.8 l12.100000000000001 26.400000000000002 h-24.200000000000003z" class="s-tree"></path><path d="M50 193.6 l13.2 28.799999999999997 h-26.4z" class="s-tree"></path><path d="M66 373.8 l12.100000000000001 26.400000000000002 h-24.200000000000003z" class="s-tree"></path><path d="M86 183.6 l13.2 28.799999999999997 h-26.4z" class="s-tree"></path><path d="M102 373.8 l12.100000000000001 26.400000000000002 h-24.200000000000003z" class="s-tree"></path><path d="M122 193.6 l13.2 28.799999999999997 h-26.4z" class="s-tree"></path><path d="M138 373.8 l12.100000000000001 26.400000000000002