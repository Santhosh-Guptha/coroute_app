<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" width="480" height="400" class="st-svg"><style>:root{--c-sky:#EAF2F2;--c-hill-far:#D7E6E4;--c-hill-near:#C7D9D4;--c-border-strong:#CFC8BD;--c-surface:#FFFFFF;--c-border:#E3DED6;--c-safety-light:#F7E6D3;--c-safety-line:#EBCBA6;--c-surface-2:#EFECE6;--c-brand:#236878;--c-text:#1F2328;--c-text-3:#5B616B;--c-safety-ink:#85550D;--c-brand-fill:#2B7A8C;--c-rider-e:#D9822B;--c-sos:#D93A2F;--c-success:#357A50;--c-rider-c:#B5577A;--c-rider-a:#3D7BC8;--c-rider-d:#B9821C;--c-bg:#F6F4F0;--c-brand-light:#D7ECEF;--c-surface-3:#E9E5DE}@media (prefers-color-scheme:dark){:root{--c-sky:#1A2127;--c-hill-far:#22303A;--c-hill-near:#1E262D;--c-border-strong:#3E4652;--c-surface:#1C2026;--c-border:#2F3540;--c-safety-light:#3A2C1D;--c-safety-line:#5A4228;--c-surface-2:#242932;--c-brand:#5FB3C4;--c-text:#E7E3DC;--c-text-3:#A7A39B;--c-safety-ink:#E9A55B;--c-brand-fill:#29707E;--c-rider-e:#E9A55B;--c-sos:#D93A2F;--c-success:#6CC08B;--c-rider-c:#D88AA6;--c-rider-a:#79A8E8;--c-rider-d:#E0B15A;--c-bg:#15181C;--c-brand-light:#1F3A40;--c-surface-3:#191C21}}text{font-family:Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}.st-svg text { font-family: var(--font-body, Manrope, system-ui, sans-serif); }.s-land { fill: var(--c-sky); }.s-hill1 { fill: var(--c-hill-far); }.s-hill2 { fill: var(--c-hill-near); }.s-tree { fill: var(--c-hill-near); stroke: var(--c-border-strong); stroke-width: 1; }.s-map { fill: var(--c-surface); stroke: var(--c-border); }.s-card { fill: var(--c-surface); stroke: var(--c-border); }.s-card-warn { fill: var(--c-safety-light); stroke: var(--c-safety-line); }.s-grid { fill: none; stroke: var(--c-border); stroke-width: 1; }.s-road { fill: none; stroke: var(--c-border-strong); stroke-width: 20; stroke-linecap: round; stroke-linejoin: round; }.s-road-in { fill: none; stroke: var(--c-surface-2); stroke-width: 15; stroke-linecap: round; stroke-linejoin: round; }.s-road-mid { fill: none; stroke: var(--c-border-strong); stroke-width: 1.5; stroke-dasharray: 6 8; }.s-route { fill: none; stroke: var(--c-brand); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }.s-route--thin { stroke-width: 4; opacity: .9; }.s-t { fill: var(--c-text); font-size: 15px; font-weight: 800; }.s-t2 { fill: var(--c-text-3); font-size: 12px; font-weight: 600; }.s-t3 { fill: var(--c-text); font-size: 13px; font-weight: 700; }.s-tw { fill: #FFFFFF; font-size: 11px; font-weight: 800; }.s-big { fill: var(--c-text); font-size: 30px; font-weight: 800; }.s-huge { fill: var(--c-text); font-size: 44px; font-weight: 800; }.s-ax { fill: var(--c-text-3); font-size: 11px; font-weight: 600; }.s-ax--warn { fill: var(--c-safety-ink); }.s-brand { fill: var(--c-brand-fill); }.s-warn { fill: var(--c-rider-e); }.s-sos { fill: var(--c-sos); }.s-ok { fill: var(--c-success); }.s-off { fill: var(--c-border-strong); }.s-ringed, .s-ring { stroke: var(--c-surface); stroke-width: 3; }.s-ring { fill: var(--c-surface); }.s-hole { fill: var(--c-surface); }.s-tick { fill: none; stroke: #FFFFFF; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }.s-r0 { fill: var(--c-brand-fill); } .s-r1 { fill: var(--c-rider-c); } .s-r2 { fill: var(--c-rider-a); }.s-r3 { fill: var(--c-rider-d); } .s-r4 { fill: var(--c-rider-e); } .s-r5 { fill: #3E8E5E; }.s-tag { fill: var(--c-text); }.s-tag-t { fill: var(--c-bg); font-size: 9.5px; font-weight: 800; }.s-track { fill: var(--c-surface-2); }.s-bar { fill: var(--c-brand-light); stroke: var(--c-brand); stroke-width: 1; }.s-bar2 { fill: var(--c-surface-3); stroke: var(--c-border-strong); stroke-width: 1; }.s-wave { fill: var(--c-brand); }.s-wave-l { fill: none; stroke: var(--c-safety-ink); stroke-width: 2.5; stroke-linecap: round; }.s-arrow { fill: none; stroke: #FFFFFF; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }.s-sign { fill: #FFFFFF; stroke: #D32F2F; stroke-width: 6; }.s-sign-t { fill: #111111; font-size: 13px; font-weight: 800; }.s-pill-warn { fill: var(--c-safety-light); stroke: var(--c-safety-line); }.s-pill-ok { fill: var(--c-surface); stroke: var(--c-border); }.s-link { fill: none; stroke: var(--c-safety-ink); stroke-width: 2; stroke-dasharray: 3 5; stroke-linecap: round; }.s-link--sos { stroke: var(--c-sos); opacity: .6; }.s-cross { stroke: var(--c-sos); stroke-width: 2; stroke-linecap: round; }.s-pulse { fill: var(--c-safety-ink); stroke: var(--c-surface); stroke-width: 2; }.s-ripple { fill: none; stroke: var(--c-sos); stroke-width: 2; }.s-ring-track { fill: none; stroke: var(--c-surface-2); stroke-width: 8; }.s-ring-sos { fill: none; stroke: var(--c-sos); stroke-width: 8; stroke-linecap: round; }.s-gauge-track { fill: none; stroke: var(--c-surface-2); stroke-width: 22; stroke-linecap: round; }.s-gauge { fill: none; stroke: var(--c-rider-e); stroke-width: 22; stroke-linecap: round; }.s-limit { fill: none; stroke: var(--c-safety-ink); stroke-width: 1.5; stroke-dasharray: 5 4; }.s-line { fill: none; stroke: var(--c-brand); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }</style><g class="st-scene"><rect width="480" height="400" class="s-land"></rect><path d="M0 120 C 90 80, 170 140, 260 104 S 420 60, 480 96 V0 H0 Z" class="s-hill1"></path><path d="M0 400 V300 C 80 270, 150 320, 240 290 S 400 250, 480 280 V400 Z" class="s-hill2"></path><rect x="12" y="12" width="290" height="376" rx="12" class="s-map"></rect><path d="M12 60 C 90 40, 180 90, 302 52" class="s-grid"></path><path d="M12 118 C 90 98, 180 148, 302 110" class="s-grid"></path><path d="M12 176 C 90 156, 180 206, 302 168" class="s-grid"></path><path d="M12 234 C 90 214, 180 264, 302 226" class="s-grid"></path><path d="M12 292 C 90 272, 180 322, 302 284" class="s-grid"></path><path d="M12 350 C 90 330, 180 380, 302 342" class="s-grid"></path><path d="M48 346 C 92 300, 66 254, 118 232 S 214 204, 190 152 S 232 92, 252 62" class="s-road"></path><path d="M48 346 C 92 300, 66 254, 118 232 S 214 204, 190 152 S 232 92, 252 62" class="s-route" 