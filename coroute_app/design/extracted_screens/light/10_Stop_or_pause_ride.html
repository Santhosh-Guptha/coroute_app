  <svg aria-hidden="true" viewBox="0 0 390 844" width="390" height="844" style="position: absolute; top: 0; left: 0" xmlns="http://www.w3.org/2000/svg">
    <rect width="390" height="844" fill="#E8EFF2"></rect>
    <g stroke="#FFFFFF" stroke-width="12" fill="none" stroke-linecap="round">
      <path d="M0 180 H390"></path><path d="M0 440 H390"></path><path d="M70 0 V844"></path><path d="M320 0 V844"></path>
    </g>
    <path d="M60 790 L150 560 L250 340 L290 160" stroke="#0B6E78" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"></path>
  </svg>
  <a href="02_Navigation_while_riding.html" aria-label="Close and keep riding" style="position: absolute; top: 0; left: 0; width: 390px; height: 844px; background: rgba(21,35,46,0.5); display: block"></a>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-radius: 28px 28px 0 0; padding: 12px 20px 32px; display: flex; flex-direction: column; gap: 18px; box-shadow: 0 -12px 40px rgba(0,0,0,0.25)">
    <div style="width: 44px; height: 5px; border-radius: 3px; background: #C2CED6; align-self: center"></div>

    <div style="display: flex; align-items: center; gap: 14px">
      <div style="width: 56px; height: 56px; border-radius: 16px; background: #FFF1E6; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
        <svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#B4541C" stroke-width="2.4" stroke-linecap="round"><path d="M9 5v14"></path><path d="M15 5v14"></path></svg>
      </div>
      <div style="display: flex; flex-direction: column; gap: 2px">
        <div style="font-size: 22px; font-weight: 800">Stopping?</div>
        <div style="font-size: 13px; font-weight: 600; color: #5B6B78">Tell the convoy so nobody waits or worries</div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <button type="button" sc-camel-on-click="{{ pickBreak }}" style="min-height: 72px; border-radius: 18px; border: 2px solid #0B6E78; background: #E3F3F5; color: #15232E; font-family: inherit; text-align: left; padding: 14px 16px; display: flex; align-items: center; gap: 14px; cursor: pointer">
        <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0B6E78" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h12v6a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4z"></path><path d="M16 10h2a2 2 0 0 1 0 4h-2"></path><path d="M6 4v2"></path><path d="M10 4v2"></path></svg>
        <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1">
          <div style="font-size: 16px; font-weight: 800">Quick break</div>
          <div style="font-size: 13px; font-weight: 600; color: #5B6B78">Convoy pauses with you · ~10 min</div>
        </div>
      </button>
      <button type="button" sc-camel-on-click="{{ pickCatch }}" style="min-height: 72px; border-radius: 18px; border: 2px solid #E1E9EE; background: #FFFFFF; color: #15232E; font-family: inherit; text-align: left; padding: 14px 16px; display: flex; align-items: center; gap: 14px; cursor: pointer">
        <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0B6E78" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg>
        <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1">
          <div style="font-size: 16px; font-weight: 800">I'll catch up</div>
          <div style="font-size: 13px; font-weight: 600; color: #5B6B78">Others keep riding · you stay on the map</div>
        </div>
      </button>
      <button type="button" sc-camel-on-click="{{ pickEnd }}" style="min-height: 72px; border-radius: 18px; border: 2px solid #E1E9EE; background: #FFFFFF; color: #15232E; font-family: inherit; text-align: left; padding: 14px 16px; display: flex; align-items: center; gap: 14px; cursor: pointer">
        <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#B4541C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="14" height="14" rx="3"></rect></svg>
        <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1">
          <div style="font-size: 16px; font-weight: 800">End my ride</div>
          <div style="font-size: 13px; font-weight: 600; color: #5B6B78">Leave the convoy and save the ride summary</div>
        </div>
      </button>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <a href="02_Navigation_while_riding.html" style="height: 58px; border-radius: 16px; background: #FFFFFF; border: 2px solid #E1E9EE; color: #15232E; font-size: 16px; font-weight: 800; display: flex; align-items: center; justify-content: center">Keep riding</a>
      <a href="02_Navigation_while_riding.html" style="height: 58px; border-radius: 16px; background: #0B6E78; color: #FFFFFF; font-size: 16px; font-weight: 800; display: flex; align-items: center; justify-content: center">Pause convoy (10 min)</a>
    </div>
