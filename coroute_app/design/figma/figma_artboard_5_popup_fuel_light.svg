<svg width="412" height="870" viewBox="0 0 412 870" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow-card-light" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#64748B" flood-opacity="0.14" />
    </filter>
    <filter id="shadow-popup-light" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.18" />
    </filter>
    <clipPath id="screen-clip">
      <rect width="412" height="870" rx="36" fill="#F8FAFC" />
    </clipPath>
  </defs>
  <g id="CoRoute_Popup_Fuel_Light" clip-path="url(#screen-clip)">
    <!-- Background Canvas -->
    <rect width="412" height="870" fill="#F8FAFC" />

    <!-- Vector Map Grid (Background) -->
    <g id="Map_Network" opacity="0.95">
      <rect width="412" height="870" fill="#EFF6FF" />
      <path d="M-20 220 H432" stroke="#DBEAFE" stroke-width="8" />
      <path d="M-20 460 H432" stroke="#DBEAFE" stroke-width="10" />
      <path d="M140 -20 V890" stroke="#DBEAFE" stroke-width="8" />
      <path d="M300 -20 V890" stroke="#DBEAFE" stroke-width="8" />
      <path d="M-20 620 Q160 400 432 540" stroke="#DBEAFE" stroke-width="16" />

      <text x="32" y="200" fill="#94A3B8" font-size="11" font-weight="700" font-family="JetBrains Mono, monospace">NH 48 EXPRESSWAY</text>
      <text x="32" y="440" fill="#94A3B8" font-size="11" font-weight="700" font-family="JetBrains Mono, monospace">NICE ROAD INTERCHANGE</text>

      <!-- Active Navigation Guidance Polyline -->
      <path d="M70 660 Q140 540 190 460 T290 320 L330 180" stroke="#00838F" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"  />
      <path d="M70 660 Q140 540 190 460 T290 320 L330 180" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 7" opacity="0.9" />

      <!-- Convoy Marker 1: Sweeper RK with Live Speed Badge -->
      <g id="Marker_Sweeper_RK" transform="translate(68, 646)">
        <circle r="16" fill="#FFFFFF" stroke="#BD5B00" stroke-width="3" />
        <text y="4" text-anchor="middle" fill="#BD5B00" font-size="11" font-weight="700" font-family="JetBrains Mono, monospace">RK</text>
        <rect x="-38" y="20" width="76" height="16" rx="5" fill="#FFFFFF" stroke="#BD5B00" stroke-width="1" />
        <text y="32" text-anchor="middle" fill="#BD5B00" font-size="8" font-weight="800" font-family="JetBrains Mono, monospace">RK &#x2022; 64 KM/H</text>
      </g>

      <!-- Convoy Marker 2: Pack VP with Live Speed Badge -->
      <g id="Marker_Pack_VP" transform="translate(188, 446)">
        <circle r="16" fill="#FFFFFF" stroke="#16A34A" stroke-width="2.5" />
        <text y="4" text-anchor="middle" fill="#16A34A" font-size="11" font-weight="700" font-family="JetBrains Mono, monospace">VP</text>
        <rect x="-38" y="20" width="76" height="16" rx="5" fill="#FFFFFF" stroke="#16A34A" stroke-width="1" />
        <text y="32" text-anchor="middle" fill="#16A34A" font-size="8" font-weight="800" font-family="JetBrains Mono, monospace">VP &#x2022; 68 KM/H</text>
      </g>

      <!-- Convoy Marker 3: Lead SB with Live Speed Badge -->
      <g id="Marker_Lead_SB" transform="translate(328, 176)">
        <circle r="22" fill="rgba(0,131,143,0.2)" />
        <circle r="17" fill="#FFFFFF" stroke="#00838F" stroke-width="3" />
        <text y="4" text-anchor="middle" fill="#00838F" font-size="12" font-weight="800" font-family="JetBrains Mono, monospace">SB</text>
        <rect x="-38" y="-34" width="76" height="16" rx="5" fill="#00838F" />
        <text y="-22" text-anchor="middle" fill="#FFFFFF" font-size="8.5" font-weight="900" font-family="JetBrains Mono, monospace">SB &#x2022; 72 KM/H</text>
      </g>
    </g>

    <!-- System Status Bar -->
    <g id="System_Status_Bar" transform="translate(24, 14)">
      <!-- Interactive Theme Toggle Button -->
      <g id="btn_theme_toggle">
        <rect x="0" y="0" width="76" height="22" rx="11" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1" />
        <text x="38" y="15" text-anchor="middle" fill="#00838F" font-size="10" font-weight="800" font-family="JetBrains Mono, monospace">LIGHT &#x21C4;</text>
      </g>
      <text x="94" y="16" fill="#64748B" font-size="12" font-weight="700" font-family="JetBrains Mono, monospace">12:40</text>
      <text x="296" y="16" fill="#00838F" font-size="11" font-weight="800" font-family="JetBrains Mono, monospace">5G</text>
      <text x="322" y="16" fill="#64748B" font-size="11" font-weight="700" font-family="JetBrains Mono, monospace">&#x25B2;&#x25B2;&#x25B2;</text>
      <text x="344" y="16" fill="#64748B" font-size="11" font-weight="700" font-family="JetBrains Mono, monospace">88%</text>
    </g>

    <!-- Top Turn-by-Turn HUD Card -->
    <g id="Top_Guidance_HUD" transform="translate(16, 48)">
      <rect width="380" height="74" rx="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#shadow-card-light)" />
      <rect x="14" y="13" width="48" height="48" rx="16" fill="#E0F2FE" stroke="#00838F" stroke-width="1.2" />
      <path d="M38 24 L38 48 M38 24 L30 32 M38 24 L46 32" stroke="#00838F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <text x="74" y="34" fill="#0F172A" font-size="14" font-weight="800" font-family="Plus Jakarta Sans, sans-serif">In 800 m <tspan fill="#64748B">&#x2022;</tspan> Keep Right</text>
      <text x="74" y="52" fill="#64748B" font-size="11" font-weight="500" font-family="Plus Jakarta Sans, sans-serif">NH 48 Expressway &#x2022; Toward Hosur</text>
      <line x1="290" y1="12" x2="290" y2="62" stroke="#E2E8F0" stroke-width="1" />
      <text x="332" y="38" text-anchor="middle" fill="#0F172A" font-size="28" font-weight="800" font-family="JetBrains Mono, monospace">68</text>
      <text x="364" y="30" fill="#64748B" font-size="10" font-weight="700" font-family="JetBrains Mono, monospace">KM/H</text>
      <rect x="298" y="44" width="70" height="18" rx="6" fill="#DCFCE7" stroke="#86EFAC" stroke-width="0.8" />
      <text x="333" y="56" text-anchor="middle" fill="#15803D" font-size="9" font-weight="800" font-family="JetBrains Mono, monospace">LIMIT 80</text>
    </g>

    <!-- Draggable CoRoute Orbit Control FAB -->
    <g id="btn_orbit_fab" transform="translate(16, 360)">
      <circle cx="26" cy="26" r="26" fill="#FFFFFF" stroke="#D97706" stroke-width="2.5" filter="url(#shadow-card-light)" />
      <!-- Orbital atom rings icon -->
      <g transform="translate(26, 26)">
        <ellipse rx="16" ry="7" fill="none" stroke="#D97706" stroke-width="2" transform="rotate(-30)" />
        <ellipse rx="16" ry="7" fill="none" stroke="#D97706" stroke-width="2" transform="rotate(30)" />
        <circle r="4" fill="#D97706" />
      </g>
    </g>

    <!-- Bottom Controls Layer -->
    <g id="Bottom_Cockpit_Controls" transform="translate(0, 680)">
      <!-- Glance Row: SOS + 5 Dock Shortcuts (MIC, STOP, FUEL, LINK, MORE) -->
      <g id="Dock_Row" transform="translate(16, 0)">
        <!-- 1. SOS Button -->
        <g id="btn_dock_sos">
          <rect width="56" height="56" rx="18" fill="#DC2626" stroke="#EF4444" stroke-width="1.5"  filter="url(#shadow-card-light)" />
          <!-- Triangle warning icon -->
          <path d="M28 16 L40 38 H16 Z" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linejoin="round" />
          <line x1="28" y1="24" x2="28" y2="30" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" />
          <circle cx="28" cy="34" r="1.2" fill="#FFFFFF" />
          <text x="28" y="48" text-anchor="middle" fill="#FFFFFF" font-size="9" font-weight="800" font-family="Plus Jakarta Sans, sans-serif">SOS</text>
        </g>

        <!-- Shortcuts Dock Frame -->
        <g id="Shortcuts_Dock" transform="translate(66, 0)">
          <rect width="314" height="56" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#shadow-card-light)" />

          <!-- 2. MIC Button -->
          <g id="btn_dock_mic" transform="translate(6, 6)">
            <rect width="56" height="44" rx="12" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1" />
            <path d="M28 14 V24 M24 18 C24 22 32 22 32 18" stroke="#00838F" stroke-width="2" stroke-linecap="round" />
            <text x="28" y="34" text-anchor="middle" fill="#00838F" font-size="9" font-weight="800" font-family="JetBrains Mono, monospace">MIC</text>
          </g>

          <!-- 3. STOP Button -> Links to Stop Picker Popup -->
          <g id="btn_dock_stop" transform="translate(68, 6)">
            <rect width="56" height="44" rx="12" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1" />
            <rect x="22" y="14" width="12" height="12" rx="3" stroke="#BD5B00" stroke-width="2" fill="none" />
            <text x="28" y="34" text-anchor="middle" fill="#BD5B00" font-size="9" font-weight="800" font-family="JetBrains Mono, monospace">STOP</text>
          </g>

          <!-- 4. FUEL Button -> Links to Fuel Radar Popup -->
          <g id="btn_dock_fuel" transform="translate(130, 6)">
            <rect width="56" height="44" rx="12" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1" />
            <path d="M24 26 V16 H30 V26 M32 18 H34 V22 H32" stroke="#00838F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
            <text x="28" y="34" text-anchor="middle" fill="#00838F" font-size="9" font-weight="800" font-family="JetBrains Mono, monospace">FUEL</text>
          </g>

          <!-- 5. LINK Button -> Links to Guardian Link Popup -->
          <g id="btn_dock_guardian" transform="translate(192, 6)">
            <rect width="56" height="44" rx="12" fill="#E0F2FE" stroke="#00838F" stroke-width="1.3" />
            <path d="M24 22 L28 18 M26 17 L30 13" stroke="#00838F" stroke-width="2" stroke-linecap="round" />
            <text x="28" y="34" text-anchor="middle" fill="#00838F" font-size="9" font-weight="900" font-family="JetBrains Mono, monospace">LINK</text>
          </g>

          <!-- 6. MORE Button -> Links to Glove Quick Settings Popup -->
          <g id="btn_dock_more" transform="translate(254, 6)">
            <rect width="54" height="44" rx="12" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1" />
            <rect x="23" y="14" width="4" height="4" rx="1" fill="#00838F" />
            <rect x="29" y="14" width="4" height="4" rx="1" fill="#00838F" />
            <rect x="23" y="20" width="4" height="4" rx="1" fill="#00838F" />
            <rect x="29" y="20" width="4" height="4" rx="1" fill="#00838F" />
            <text x="27" y="34" text-anchor="middle" fill="#00838F" font-size="9" font-weight="800" font-family="JetBrains Mono, monospace">MORE</text>
          </g>
        </g>
      </g>

      <!-- Collapsed Bottom Sheet -->
      <g id="Collapsed_Bottom_Sheet" transform="translate(0, 68)">
        <path d="M0 24 C0 10.745 10.745 0 24 0 H388 C401.255 0 412 10.745 412 24 V130 H0 Z" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#shadow-card-light)" />
        <rect x="186" y="8" width="40" height="5" rx="2.5" fill="#CBD5E1" />

        <!-- Convoy Header Row -> Links to Screen 5: Group Settings -->
        <g id="btn_convoy_header">
          <text x="20" y="38" fill="#0F172A" font-size="13" font-weight="800" font-family="Plus Jakarta Sans, sans-serif">Bangalore Highway Convoy</text>
          <rect x="180" y="24" width="60" height="18" rx="9" fill="#E0F2FE" stroke="#00838F" stroke-width="0.8" />
          <text x="210" y="36" text-anchor="middle" fill="#00838F" font-size="9" font-weight="800" font-family="Plus Jakarta Sans, sans-serif">3 Riders</text>
          <text x="392" y="38" text-anchor="end" fill="#64748B" font-size="11" font-weight="700" font-family="JetBrains Mono, monospace">ETA 14:15 &#x2022; 82 km</text>
        </g>

        <!-- Live Fuel & Guardian Status Strip -> Links to Screen 4: Fuel Radar -->
        <g id="btn_fuel_strip" transform="translate(16, 50)">
          <rect width="380" height="42" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
          <circle cx="16" cy="21" r="5" fill="#D97706" />
          <text x="28" y="25" fill="#334155" font-size="11" font-weight="600" font-family="Plus Jakarta Sans, sans-serif">Usable Range: <tspan fill="#0F172A" font-weight="800" font-family="JetBrains Mono, monospace">185 km</tspan></text>
          <path d="M260 21 L270 21 M263 17 L267 25" stroke="#00838F" stroke-width="1.8" stroke-linecap="round" />
          <text x="364" y="25" text-anchor="end" fill="#00838F" font-size="11" font-weight="800" font-family="Plus Jakarta Sans, sans-serif">Guardian Active</text>
        </g>
      </g>
    </g>

    <rect id="btn_modal_backdrop" width="412" height="870" fill="#000000" fill-opacity="0.6" />

    <!-- In-Cockpit Fuel Radar Modal Overlay -->
    <g id="InCockpit_Fuel_Modal" transform="translate(0, 180)">
      <path d="M0 28 C0 12.536 12.536 0 28 0 H384 C399.464 0 412 12.536 412 28 V690 H0 Z" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#shadow-popup-light)" />
      <rect x="186" y="10" width="40" height="5" rx="2.5" fill="#CBD5E1" />

      <!-- Modal Header -->
      <g transform="translate(20, 24)">
        <text x="0" y="24" fill="#0F172A" font-size="18" font-weight="900" font-family="Plus Jakarta Sans, sans-serif">Fuel Estimation &amp; Radar</text>
        <text x="0" y="42" fill="#64748B" font-size="11" font-weight="500" font-family="Plus Jakarta Sans, sans-serif">Convoy tank ranges &amp; verified highway pumps</text>
        <g id="btn_close_popup">
          <rect x="312" y="6" width="60" height="34" rx="12" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1" />
          <text x="342" y="27" text-anchor="middle" fill="#0F172A" font-size="12" font-weight="700" font-family="Plus Jakarta Sans, sans-serif">Done</text>
        </g>
        <line x1="0" y1="52" x2="372" y2="52" stroke="#E2E8F0" stroke-width="1" />
      </g>

      <!-- Hero Range Card -->
      <g transform="translate(20, 92)">
        <rect width="372" height="114" rx="20" fill="#FEF3C7" stroke="#BD5B00" stroke-width="1.8" />
        <text x="18" y="28" fill="#BD5B00" font-size="11" font-weight="800" font-family="Plus Jakarta Sans, sans-serif">YOUR USABLE TANK RANGE</text>
        <text x="18" y="68" fill="#0F172A" font-size="36" font-weight="900" font-family="JetBrains Mono, monospace">185</text>
        <text x="96" y="66" fill="#64748B" font-size="13" font-weight="700" font-family="JetBrains Mono, monospace">KM</text>
        <text x="18" y="94" fill="#15803D" font-size="11" font-weight="700" font-family="Plus Jakarta Sans, sans-serif">&#x2714; Destination Reachable (82 km remaining)</text>
      </g>

      <!-- Convoy Fuel Radar List -->
      <g transform="translate(20, 222)">
        <text x="0" y="16" fill="#64748B" font-size="11" font-weight="800" font-family="Plus Jakarta Sans, sans-serif">CONVOY TANK STATUS</text>
        
        <rect y="26" width="372" height="52" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
        <text x="16" y="56" fill="#0F172A" font-size="12" font-weight="700" font-family="Plus Jakarta Sans, sans-serif">Lead SB (KTM 390 Adv)</text>
        <text x="356" y="56" text-anchor="end" fill="#15803D" font-size="12" font-weight="800" font-family="JetBrains Mono, monospace">185 km</text>

        <rect y="86" width="372" height="52" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
        <text x="16" y="116" fill="#0F172A" font-size="12" font-weight="700" font-family="Plus Jakarta Sans, sans-serif">Rider VP (Himalayan 450)</text>
        <text x="356" y="116" text-anchor="end" fill="#15803D" font-size="12" font-weight="800" font-family="JetBrains Mono, monospace">210 km</text>

        <rect y="146" width="372" height="56" rx="14" fill="#FEF3C7" stroke="#BD5B00" stroke-width="1.2" />
        <text x="16" y="174" fill="#BD5B00" font-size="12" font-weight="800" font-family="Plus Jakarta Sans, sans-serif">Sweeper RK (Low Fuel Deficit)</text>
        <text x="16" y="190" fill="#64748B" font-size="10" font-weight="500" font-family="Plus Jakarta Sans, sans-serif">Needs station before km 64</text>
        <text x="356" y="180" text-anchor="end" fill="#BD5B00" font-size="13" font-weight="900" font-family="JetBrains Mono, monospace">64 km &#x26A0;</text>
      </g>

      <!-- Broadcast Button -->
      <g id="btn_broadcast_refuel" transform="translate(20, 600)">
        <rect width="372" height="52" rx="16" fill="#BD5B00" />
        <text x="186" y="32" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="900" font-family="Plus Jakarta Sans, sans-serif">BROADCAST REFUEL STOP TO CONVOY</text>
      </g>
    </g>
  </g>
</svg>