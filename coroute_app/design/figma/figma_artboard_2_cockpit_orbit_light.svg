<svg width="412" height="870" viewBox="0 0 412 870" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow-card-light" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#64748B" flood-opacity="0.14" />
    </filter>
    <filter id="shadow-popup-light" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.18" />
    </filter>
    <clipPath id="screen-clip">
      <rect width="412" height="870" rx="36" fill="#F8FAFC" />
    </clipPath>
  </defs>
  <g id="CoRoute_Cockpit_Orbit_Light" clip-path="url(#screen-clip)">
    <!-- Background Canvas -->
    <rect width="412" height="870" fill="#F8FAFC" />

    <!-- Vector Map Grid (Background) -->
    <g id="Map_Network" opacity="0.95">
      <rect width="412" height="870" fill="#EFF6FF" />
      <path d="M-20 220 H432" stroke="#DBEAFE" stroke-width="8" />
      <path d="M-20 460 H432" stroke="#DBEAFE" stroke-width="10" />
      <path d="M140 -20 V890" stroke="#DBEAFE" stroke-width="8" />
      <path d="M300 -20 V890" stroke="#DBEAFE" stroke-width="8" />
      <path d="M-20 620 Q160 400 432 540" stroke="#DBEAFE" stroke-width="16" />

      <text x="32" y="200" fill="#94A3B8" font-size="11" font-weight="700" font-family="JetBrains Mono, monospace">NH 48 EXPRESSWAY</text>
      <text x="32" y="440" fill="#94A3B8" font-size="11" font-weight="700" font-family="JetBrains Mono, monospace">NICE ROAD INTERCHANGE</text>

      <!-- Active Navigation Guidance Polyline -->
      <path d="M70 660 Q140 540 190 460 T290 320 L330 180" stroke="#00838F" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"  />
      <path d="M70 660 Q140 540 190 460 T290 320 L330 180" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 7" opacity="0.9" />

      <!-- Convoy Marker 1: Sweeper RK with Live Speed Badge -->
      <g id="Marker_Sweeper_RK" transform="translate(68, 646)">
        <circle r="16" fill="#FFFFFF" stroke="#BD5B00" stroke-width="3" />
        <text y="4" text-anchor="middle" fill="#BD5B00" font-size="11" font-weight="700" font-family="JetBrains Mono, monospace">RK</text>
        <rect x="-38" y="20" width="76" height="16" rx="5" fill="#FFFFFF" stroke="#BD5B00" stroke-width="1" />
        <text y="32" text-anchor="middle" fill="#BD5B00" font-size="8" font-weight="800" font-family="JetBrains Mono, monospace">RK &#x2022; 64 KM/H</text>
      </g>

      <!-- Convoy Marker 2: Pack VP with Live Speed Badge -->
      <g id="Marker_Pack_VP" transform="translate(188, 446)">
        <circle r="16" fill="#FFFFFF" stroke="#16A34A" stroke-width="2.5" />
        <text y="4" text-anchor="middle" fill="#16A34A" font-size="11" font-weight="700" font-family="JetBrains Mono, monospace">VP</text>
        <rect x="-38" y="20" width="76" height="16" rx="5" fill="#FFFFFF" stroke="#16A34A" stroke-width="1" />
        <text y="32" text-anchor="middle" fill="#16A34A" font-size="8" font-weight="800" font-family="JetBrains Mono, monospace">VP &#x2022; 68 KM/H</text>
      </g>

      <!-- Convoy Marker 3: Lead SB with Live Speed Badge -->
      <g id="Marker_Lead_SB" transform="translate(328, 176)">
        <circle r="22" fill="rgba(0,131,143,0.2)" />
        <circle r="17" fill="#FFFFFF" stroke="#00838F" stroke-width="3" />
        <text y="4" text-anchor="middle" fill="#00838F" font-size="12" font-weight="800" font-family="JetBrains Mono, monospace">SB</text>
        <rect x="-38" y="-34" width="76" height="16" rx="5" fill="#00838F" />
        <text y="-22" text-anchor="middle" fill="#FFFFFF" font-size="8.5" font-weight="900" font-family="JetBrains Mono, monospace">SB &#x2022; 72 KM/H</text>
      </g>
    </g>

    <!-- System Status Bar -->
    <g id="System_Status_Bar" transform="translate(24, 14)">
      <!-- Interactive Theme Toggle Button -->
      <g id="btn_theme_toggle">
        <rect x="0" y="0" width="76" height="22" rx="11" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1" />
        <text x="38" y="15" text-anchor="middle" fill="#00838F" font-size="10" font-weight="800" font-family="JetBrains Mono, monospace">LIGHT &#x21C4;</text>
      </g>
      <text x="94" y="16" fill="#64748B" font-size="12" font-weight="700" font-family="JetBrains Mono, monospace">12:40</text>
      <text x="296" y="16" fill="#00838F" font-size="11" font-weight="800" font-family="JetBrains Mono, monospace">5G</text>
      <text x="322" y="16" fill="#64748B" font-size="11" font-weight="700" font-family="JetBrains Mono, monospace">&#x25B2;&#x25B2;&#x25B2;</text>
      <text x="344" y="16" fill="#64748B" font-size="11" font-weight="700" font-family="JetBrains Mono, monospace">88%</text>
    </g>

    <!-- Minimal Frosted-Glass Top Status Pill (MinimalCockpitTopBar) -->
    <g id="Minimal_Cockpit_Top_Bar" transform="translate(16, 44)">
      <rect width="380" height="48" rx="24" fill="rgba(255,255,255,0.92)" stroke="rgba(0,131,143,0.3)" stroke-width="1.2" filter="url(#shadow-card-light)" />
      <!-- Left: Destination & Distance -->
      <text x="20" y="27" fill="#0F172A" font-size="14" font-weight="800" font-family="Plus Jakarta Sans, sans-serif">To Hampi, 142 km</text>
      <text x="20" y="40" fill="#64748B" font-size="10" font-weight="600" font-family="Plus Jakarta Sans, sans-serif">NH 48 Expressway &#x2022; Next stop 42 km</text>
      <!-- Right: Live GPS Status Dot -->
      <circle cx="340" cy="24" r="4" fill="#00838F"  />
      <text x="352" y="27" fill="#00838F" font-size="10" font-weight="800" font-family="JetBrains Mono, monospace">GPS</text>
    </g>

    <!-- Draggable CoRoute Orbit Control FAB -->
    <g id="btn_orbit_fab" transform="translate(16, 360)">
      <circle cx="26" cy="26" r="26" fill="#FFFFFF" stroke="#D97706" stroke-width="2.5" filter="url(#shadow-card-light)" />
      <!-- Orbital atom rings icon -->
      <g transform="translate(26, 26)">
        <ellipse rx="16" ry="7" fill="none" stroke="#D97706" stroke-width="2" transform="rotate(-30)" />
        <ellipse rx="16" ry="7" fill="none" stroke="#D97706" stroke-width="2" transform="rotate(30)" />
        <circle r="4" fill="#D97706" />
      </g>
    </g>

    <!-- Floating Right-Side Controls (MapSideControls: Brightness, Re-center, Sheet) -->
    <g id="Map_Side_Controls" transform="translate(352, 530)">
      <!-- 1. Screen On / Brightness -->
      <g id="btn_side_brightness" transform="translate(0, 0)">
        <circle cx="22" cy="22" r="22" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" filter="url(#shadow-card-light)" />
        <circle cx="22" cy="22" r="6" fill="none" stroke="#D97706" stroke-width="2" />
        <line x1="22" y1="10" x2="22" y2="13" stroke="#D97706" stroke-width="2" stroke-linecap="round" />
        <line x1="22" y1="31" x2="22" y2="34" stroke="#D97706" stroke-width="2" stroke-linecap="round" />
      </g>
      <!-- 2. Re-Center on Me Crosshair (Active Cyan Glow) -->
      <g id="btn_side_recenter" transform="translate(0, 52)">
        <circle cx="22" cy="22" r="22" fill="#FFFFFF" stroke="#00838F" stroke-width="1.8"  filter="url(#shadow-card-light)" />
        <circle cx="22" cy="22" r="7" fill="none" stroke="#00838F" stroke-width="2" />
        <circle cx="22" cy="22" r="2.5" fill="#00838F" />
        <line x1="22" y1="9" x2="22" y2="12" stroke="#00838F" stroke-width="2" />
        <line x1="22" y1="32" x2="22" y2="35" stroke="#00838F" stroke-width="2" />
        <line x1="9" y1="22" x2="12" y2="22" stroke="#00838F" stroke-width="2" />
        <line x1="32" y1="22" x2="35" y2="22" stroke="#00838F" stroke-width="2" />
      </g>
      <!-- 3. Open Ride Sheet Chevron -->
      <g id="btn_side_sheet" transform="translate(0, 104)">
        <circle cx="22" cy="22" r="22" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" filter="url(#shadow-card-light)" />
        <path d="M15 25 L22 18 L29 25" fill="none" stroke="#0F172A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
      </g>
    </g>

    <!-- Hold-to-SOS Button (Always pinned bottom-left above collapsed sheet) -->
    <g id="btn_cockpit_sos" transform="translate(16, 686)">
      <circle cx="28" cy="28" r="28" fill="#DC2626" stroke="#EF4444" stroke-width="2"  filter="url(#shadow-card-light)" />
      <path d="M28 17 L39 37 H17 Z" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linejoin="round" />
      <line x1="28" y1="24" x2="28" y2="30" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" />
      <circle cx="28" cy="34" r="1.2" fill="#FFFFFF" />
      <text x="28" y="46" text-anchor="middle" fill="#FFFFFF" font-size="8" font-weight="900" font-family="Plus Jakarta Sans, sans-serif">SOS</text>
    </g>

    <!-- Collapsed Bottom Sheet: 2x2 Metric Strip Header -->
    <g id="Collapsed_Bottom_Sheet" transform="translate(0, 752)">
      <path d="M0 20 C0 8.954 8.954 0 20 0 H392 C403.046 0 412 8.954 412 20 V118 H0 Z" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" filter="url(#shadow-card-light)" />
      <!-- Drag handle -->
      <rect x="188" y="8" width="36" height="4" rx="2" fill="#CBD5E1" />

      <!-- 4 Key Numbers (2x2 Grid) -->
      <g id="Metrics_2x2_Grid" transform="translate(24, 22)">
        <!-- 1. Remaining -->
        <g id="metric_remaining" transform="translate(0, 0)">
          <text x="0" y="24" fill="#0F172A" font-size="20" font-weight="900" font-family="Plus Jakarta Sans, sans-serif">142 km</text>
          <text x="0" y="38" fill="#64748B" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, sans-serif">left</text>
        </g>
        <line x1="88" y1="8" x2="88" y2="44" stroke="#E2E8F0" stroke-width="1" />

        <!-- 2. ETA -->
        <g id="metric_eta" transform="translate(100, 0)">
          <text x="0" y="24" fill="#0F172A" font-size="20" font-weight="900" font-family="Plus Jakarta Sans, sans-serif">4:35 PM</text>
          <text x="0" y="38" fill="#64748B" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, sans-serif">ETA</text>
        </g>
        <line x1="190" y1="8" x2="190" y2="44" stroke="#E2E8F0" stroke-width="1" />

        <!-- 3. Riding Count -->
        <g id="metric_riding" transform="translate(202, 0)">
          <text x="0" y="24" fill="#0F172A" font-size="20" font-weight="900" font-family="Plus Jakarta Sans, sans-serif">5/8</text>
          <text x="0" y="38" fill="#64748B" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, sans-serif">riding</text>
        </g>
        <line x1="264" y1="8" x2="264" y2="44" stroke="#E2E8F0" stroke-width="1" />

        <!-- 4. Spread -->
        <g id="metric_spread" transform="translate(276, 0)">
          <text x="0" y="24" fill="#0F172A" font-size="20" font-weight="900" font-family="Plus Jakarta Sans, sans-serif">2.1 km</text>
          <text x="0" y="38" fill="#64748B" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, sans-serif">spread</text>
        </g>
      </g>
    </g>

    <!-- Semi-transparent non-blocking backdrop -->
    <rect id="btn_orbit_backdrop" width="412" height="870" fill="#000000" fill-opacity="0.5" />

    <!-- CoRoute Orbit Floating Quick Access Popup Card -->
    <g id="Orbit_Quick_Access_Card" transform="translate(56, 260)">
      <rect width="300" height="240" rx="24" fill="#FFFFFF" stroke="#00838F" stroke-width="1.8" filter="url(#shadow-popup-light)" />
      
      <!-- Card Header -->
      <text x="20" y="32" fill="#0F172A" font-size="12" font-weight="900" font-family="Plus Jakarta Sans, sans-serif" letter-spacing="1">COROUTE ORBIT</text>
      <rect x="180" y="16" width="102" height="22" rx="11" fill="#E0F2FE" stroke="#00838F" stroke-width="0.8" />
      <text x="231" y="31" text-anchor="middle" fill="#00838F" font-size="9.5" font-weight="800" font-family="Plus Jakarta Sans, sans-serif">QUICK ACCESS</text>

      <!-- 6 Quick Access Glove Action Tiles (2 Rows x 3 Columns) -->
      <!-- Row 1: Intercom | Group | Fuel -->
      <!-- 1. Intercom Tile -->
      <g id="btn_orbit_intercom" transform="translate(18, 52)">
        <rect width="80" height="74" rx="16" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1" />
        <path d="M40 24 V34 M36 28 C36 32 44 32 44 28" stroke="#00838F" stroke-width="2.2" stroke-linecap="round" />
        <text x="40" y="54" text-anchor="middle" fill="#0F172A" font-size="11" font-weight="700" font-family="Plus Jakarta Sans, sans-serif">Intercom</text>
      </g>

      <!-- 2. Group Tile -> Opens Group Settings Popup -->
      <g id="btn_orbit_group" transform="translate(110, 52)">
        <rect width="80" height="74" rx="16" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1" />
        <!-- 2 riders icon -->
        <circle cx="36" cy="24" r="5" stroke="#00838F" stroke-width="1.8" />
        <circle cx="46" cy="22" r="4" stroke="#00838F" stroke-width="1.5" />
        <path d="M28 38 C28 32 34 30 38 30 C42 30 46 32 46 38" stroke="#00838F" stroke-width="1.8" stroke-linecap="round" />
        <text x="40" y="54" text-anchor="middle" fill="#0F172A" font-size="11" font-weight="700" font-family="Plus Jakarta Sans, sans-serif">Group</text>
      </g>

      <!-- 3. Fuel Tile -> Opens Fuel Range Radar Popup -->
      <g id="btn_orbit_fuel" transform="translate(202, 52)">
        <rect width="80" height="74" rx="16" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1" />
        <path d="M36 38 V22 H44 V38 M46 26 H48 V32 H46" stroke="#00838F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
        <text x="40" y="54" text-anchor="middle" fill="#0F172A" font-size="11" font-weight="700" font-family="Plus Jakarta Sans, sans-serif">Fuel</text>
      </g>

      <!-- Row 2: Route | Guardian | More -->
      <!-- 4. Route Tile -> Opens Route Essentials / Corridor -->
      <g id="btn_orbit_route" transform="translate(18, 140)">
        <rect width="80" height="74" rx="16" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1" />
        <!-- Turn arrow icon -->
        <path d="M34 38 V28 C34 24 46 24 46 20 M42 22 L46 18 L50 22" stroke="#00838F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        <text x="40" y="54" text-anchor="middle" fill="#0F172A" font-size="11" font-weight="700" font-family="Plus Jakarta Sans, sans-serif">Route</text>
      </g>

      <!-- 5. Guardian Tile -> Opens Ride Guardian Link Popup -->
      <g id="btn_orbit_guardian" transform="translate(110, 140)">
        <rect width="80" height="74" rx="16" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1" />
        <!-- Shield with check icon -->
        <path d="M40 18 L48 22 V28 C48 34 40 38 40 38 C40 38 32 34 32 28 V22 Z" fill="none" stroke="#00838F" stroke-width="1.8" stroke-linejoin="round" />
        <path d="M37 28 L39 30 L43 26" stroke="#00838F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
        <text x="40" y="54" text-anchor="middle" fill="#0F172A" font-size="11" font-weight="700" font-family="Plus Jakarta Sans, sans-serif">Guardian</text>
      </g>

      <!-- 6. More Tile -> Opens Glove Quick Settings Popup -->
      <g id="btn_orbit_more" transform="translate(202, 140)">
        <rect width="80" height="74" rx="16" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1" />
        <!-- 4 squares grid icon -->
        <rect x="33" y="22" width="6" height="6" rx="1.5" fill="#00838F" />
        <rect x="41" y="22" width="6" height="6" rx="1.5" fill="#00838F" />
        <rect x="33" y="30" width="6" height="6" rx="1.5" fill="#00838F" />
        <rect x="41" y="30" width="6" height="6" rx="1.5" fill="#00838F" />
        <text x="40" y="54" text-anchor="middle" fill="#0F172A" font-size="11" font-weight="700" font-family="Plus Jakarta Sans, sans-serif">More</text>
      </g>
    </g>
  </g>
</svg>