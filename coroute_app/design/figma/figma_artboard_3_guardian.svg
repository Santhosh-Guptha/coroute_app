<svg width="412" height="870" viewBox="0 0 412 870" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-sos" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-amber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-red" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <clipPath id="screen-clip">
      <rect width="412" height="870" rx="36" fill="#070A0F" />
    </clipPath>
  </defs>
  <g id="CoRoute_Ride_Guardian_Link" clip-path="url(#screen-clip)">
    <rect width="412" height="870" fill="#0A0E17" />
    <!-- System Status Bar -->
    <g id="System_Status_Bar" transform="translate(24, 14)">
      <!-- Interactive Theme Toggle Button -->
      <g id="btn_theme_toggle">
        <rect x="0" y="0" width="76" height="22" rx="11" fill="#1E293B" stroke="#334155" stroke-width="1" />
        <text x="38" y="15" text-anchor="middle" fill="#00E5FF" font-size="10" font-weight="800" font-family="JetBrains Mono, monospace">DARK &#x21C4;</text>
      </g>
      <text x="94" y="16" fill="#94A3B8" font-size="12" font-weight="700" font-family="JetBrains Mono, monospace">12:40</text>
      <text x="296" y="16" fill="#00E5FF" font-size="11" font-weight="800" font-family="JetBrains Mono, monospace">5G</text>
      <text x="322" y="16" fill="#94A3B8" font-size="11" font-weight="700" font-family="JetBrains Mono, monospace">&#x25B2;&#x25B2;&#x25B2;</text>
      <text x="344" y="16" fill="#94A3B8" font-size="11" font-weight="700" font-family="JetBrains Mono, monospace">88%</text>
    </g>

    <!-- Header Frame -->
    <g id="Modal_Header" transform="translate(20, 48)">
      <circle cx="10" cy="18" r="5" fill="#00E5FF" filter="url(#glow-cyan)" />
      <text x="24" y="24" fill="#FFFFFF" font-size="20" font-weight="800" font-family="Plus Jakarta Sans, sans-serif">Ride Guardian Link</text>
      <text x="24" y="44" fill="#94A3B8" font-size="12" font-weight="500" font-family="Plus Jakarta Sans, sans-serif">Live convoy tracking for family &amp; monitors</text>
      <!-- Done Button -> Links to Screen 1 -->
      <g id="btn_close_guardian">
        <rect x="312" y="4" width="60" height="36" rx="14" fill="#1E293B" stroke="#1E293B" stroke-width="1" />
        <text x="342" y="26" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700" font-family="Plus Jakarta Sans, sans-serif">Done</text>
      </g>
      <line x1="0" y1="58" x2="372" y2="58" stroke="#1E293B" stroke-width="1" />
    </g>

    <!-- Zero-App-Install Security Card -->
    <g id="Security_Info_Card" transform="translate(20, 126)">
      <rect width="372" height="136" rx="24" fill="#083344" fill-opacity="0.5" stroke="#00E5FF" stroke-width="1.5" filter="url(#glow-cyan)"  />
      <text x="18" y="32" fill="#00E5FF" font-size="12" font-weight="800" font-family="Plus Jakarta Sans, sans-serif" letter-spacing="1">ZERO APP INSTALL REQUIRED</text>
      <rect x="290" y="16" width="66" height="20" rx="10" fill="#0E7490" />
      <text x="323" y="30" text-anchor="middle" fill="#FFFFFF" font-size="9" font-weight="800" font-family="JetBrains Mono, monospace">WEB LIVE</text>
      
      <text x="18" y="60" fill="#FFFFFF" font-size="12" font-weight="500" font-family="Plus Jakarta Sans, sans-serif">Family members and club marshals can watch your</text>
      <text x="18" y="78" fill="#FFFFFF" font-size="12" font-weight="500" font-family="Plus Jakarta Sans, sans-serif">convoy progress in real time in any browser.</text>

      <line x1="18" y1="94" x2="354" y2="94" stroke="#1E293B" stroke-width="1" />
      <text x="18" y="116" fill="#00E5FF" font-size="11" font-weight="700" font-family="JetBrains Mono, monospace">&#x2714; Read-Only</text>
      <text x="144" y="116" fill="#00E5FF" font-size="11" font-weight="700" font-family="JetBrains Mono, monospace">&#x2714; 24h Expiry</text>
      <text x="260" y="116" fill="#00E5FF" font-size="11" font-weight="700" font-family="JetBrains Mono, monospace">&#x2714; End-to-End</text>
    </g>

    <!-- Shareable Link Card -->
    <g id="Shareable_Link_Box" transform="translate(20, 282)">
      <rect width="372" height="154" rx="24" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"  />
      <text x="18" y="30" fill="#94A3B8" font-size="12" font-weight="800" font-family="Plus Jakarta Sans, sans-serif" letter-spacing="0.5">SHAREABLE WEB LINK</text>
      
      <rect x="18" y="44" width="336" height="42" rx="14" fill="#070A0F" stroke="#1E293B" stroke-width="1" />
      <text x="30" y="70" fill="#00E5FF" font-size="11" font-weight="600" font-family="JetBrains Mono, monospace">https://coroute.duckdns.org/watch/gd_9b3f7a18c2</text>

      <!-- Action Buttons -->
      <g id="btn_copy_link" transform="translate(18, 98)">
        <rect width="162" height="42" rx="14" fill="#00E5FF" />
        <text x="81" y="26" text-anchor="middle" fill="#070A0F" font-size="12" font-weight="800" font-family="Plus Jakarta Sans, sans-serif">Copy Link</text>
      </g>
      <g id="btn_share_family" transform="translate(192, 98)">
        <rect width="162" height="42" rx="14" fill="#1E293B" stroke="#1E293B" stroke-width="1" />
        <text x="81" y="26" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700" font-family="Plus Jakarta Sans, sans-serif">Share with Family</text>
      </g>
    </g>

    <!-- Connected Observers Card -->
    <g id="Connected_Observers_Card" transform="translate(20, 456)">
      <rect width="372" height="136" rx="24" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"  />
      <text x="18" y="30" fill="#94A3B8" font-size="12" font-weight="800" font-family="Plus Jakarta Sans, sans-serif" letter-spacing="0.5">CONNECTED OBSERVERS</text>
      <text x="354" y="30" text-anchor="end" fill="#00E676" font-size="11" font-weight="700" font-family="JetBrains Mono, monospace">1 Active Now</text>

      <rect x="18" y="44" width="336" height="48" rx="16" fill="#070A0F" stroke="#1E293B" stroke-width="1" />
      <circle cx="36" cy="68" r="5" fill="#00E676" />
      <text x="50" y="62" fill="#FFFFFF" font-size="12" font-weight="700" font-family="Plus Jakarta Sans, sans-serif">Mom &amp; Family (Home)</text>
      <text x="50" y="78" fill="#94A3B8" font-size="10" font-weight="500" font-family="Plus Jakarta Sans, sans-serif">Viewing via Mobile Chrome</text>
      <text x="338" y="72" text-anchor="end" fill="#00E5FF" font-size="11" font-weight="800" font-family="JetBrains Mono, monospace">LIVE</text>

      <text x="18" y="118" fill="#94A3B8" font-size="11" font-weight="500" font-family="Plus Jakarta Sans, sans-serif">Created by Convoy Lead SB</text>
      <text x="354" y="118" text-anchor="end" fill="#F59E0B" font-size="11" font-weight="700" font-family="JetBrains Mono, monospace">Expires in 22h 15m</text>
    </g>

    <!-- Revoke All Button -->
    <g id="btn_revoke_links" transform="translate(20, 780)">
      <rect width="372" height="52" rx="16" fill="#450A0A" stroke="#DC2626" stroke-width="1.2"  />
      <text x="186" y="32" text-anchor="middle" fill="#DC2626" font-size="13" font-weight="800" font-family="Plus Jakarta Sans, sans-serif">Revoke All Active Guardian Links</text>
    </g>
  </g>
</svg>