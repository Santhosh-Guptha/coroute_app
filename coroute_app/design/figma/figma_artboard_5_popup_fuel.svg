<svg width="412" height="870" viewBox="0 0 412 870" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-sos" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-amber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-orbit" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <clipPath id="screen-clip">
      <rect width="412" height="870" rx="36" fill="#070A0F" />
    </clipPath>
  </defs>
  <g id="CoRoute_Popup_Fuel_Dark" clip-path="url(#screen-clip)">
    <!-- Background Canvas -->
    <rect width="412" height="870" fill="#070A0F" />

    <!-- Vector Map Grid (Background) -->
    <g id="Map_Network" opacity="0.95">
      <rect width="412" height="870" fill="#0A0E17" />
      <path d="M-20 220 H432" stroke="#162235" stroke-width="8" />
      <path d="M-20 460 H432" stroke="#162235" stroke-width="10" />
      <path d="M140 -20 V890" stroke="#162235" stroke-width="8" />
      <path d="M300 -20 V890" stroke="#162235" stroke-width="8" />
      <path d="M-20 620 Q160 400 432 540" stroke="#162235" stroke-width="16" />

      <text x="32" y="200" fill="#475569" font-size="11" font-weight="700" font-family="JetBrains Mono, monospace">NH 48 EXPRESSWAY</text>
      <text x="32" y="440" fill="#475569" font-size="11" font-weight="700" font-family="JetBrains Mono, monospace">NICE ROAD INTERCHANGE</text>

      <!-- Active Navigation Guidance Polyline -->
      <path d="M70 660 Q140 540 190 460 T290 320 L330 180" stroke="#00E5FF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow-cyan)" />
      <path d="M70 660 Q140 540 190 460 T290 320 L330 180" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 7" opacity="0.9" />

      <!-- Convoy Marker 1: Sweeper RK with Live Speed Badge -->
      <g id="Marker_Sweeper_RK" transform="translate(68, 646)">
        <circle r="16" fill="#0F172A" stroke="#FF9100" stroke-width="3" />
        <text y="4" text-anchor="middle" fill="#FF9100" font-size="11" font-weight="700" font-family="JetBrains Mono, monospace">RK</text>
        <rect x="-38" y="20" width="76" height="16" rx="5" fill="#0F172A" stroke="#FF9100" stroke-width="1" />
        <text y="32" text-anchor="middle" fill="#FF9100" font-size="8" font-weight="800" font-family="JetBrains Mono, monospace">RK &#x2022; 64 KM/H</text>
      </g>

      <!-- Convoy Marker 2: Pack VP with Live Speed Badge -->
      <g id="Marker_Pack_VP" transform="translate(188, 446)">
        <circle r="16" fill="#0F172A" stroke="#00E676" stroke-width="2.5" />
        <text y="4" text-anchor="middle" fill="#00E676" font-size="11" font-weight="700" font-family="JetBrains Mono, monospace">VP</text>
        <rect x="-38" y="20" width="76" height="16" rx="5" fill="#0F172A" stroke="#00E676" stroke-width="1" />
        <text y="32" text-anchor="middle" fill="#00E676" font-size="8" font-weight="800" font-family="JetBrains Mono, monospace">VP &#x2022; 68 KM/H</text>
      </g>

      <!-- Convoy Marker 3: Lead SB with Live Speed Badge -->
      <g id="Marker_Lead_SB" transform="translate(328, 176)">
        <circle r="22" fill="rgba(0,229,255,0.25)" />
        <circle r="17" fill="#0F172A" stroke="#00E5FF" stroke-width="3" />
        <text y="4" text-anchor="middle" fill="#00E5FF" font-size="12" font-weight="800" font-family="JetBrains Mono, monospace">SB</text>
        <rect x="-38" y="-34" width="76" height="16" rx="5" fill="#00E5FF" />
        <text y="-22" text-anchor="middle" fill="#070A0F" font-size="8.5" font-weight="900" font-family="JetBrains Mono, monospace">SB &#x2022; 72 KM/H</text>
      </g>
    </g>

    <!-- System Status Bar -->
    <g id="System_Status_Bar" transform="translate(24, 14)">
      <!-- Interactive Theme Toggle Button -->
      <g id="btn_theme_toggle">
        <rect x="0" y="0" width="76" height="22" rx="11" fill="#1E293B" stroke="#334155" stroke-width="1" />
        <text x="38" y="15" text-anchor="middle" fill="#00E5FF" font-size="10" font-weight="800" font-family="JetBrains Mono, monospace">DARK &#x21C4;</text>
      </g>
      <text x="94" y="16" fill="#94A3B8" font-size="12" font-weight="700" font-family="JetBrains Mono, monospace">12:40</text>
      <text x="296" y="16" fill="#00E5FF" font-size="11" font-weight="800" font-family="JetBrains Mono, monospace">5G</text>
      <text x="322" y="16" fill="#94A3B8" font-size="11" font-weight="700" font-family="JetBrains Mono, monospace">&#x25B2;&#x25B2;&#x25B2;</text>
      <text x="344" y="16" fill="#94A3B8" font-size="11" font-weight="700" font-family="JetBrains Mono, monospace">88%</text>
    </g>

    <!-- Minimal Frosted-Glass Top Status Pill (MinimalCockpitTopBar) -->
    <g id="Minimal_Cockpit_Top_Bar" transform="translate(16, 44)">
      <rect width="380" height="48" rx="24" fill="rgba(7,10,15,0.85)" stroke="rgba(0,229,255,0.35)" stroke-width="1.2"  />
      <!-- Left: Destination & Distance -->
      <text x="20" y="27" fill="#FFFFFF" font-size="14" font-weight="800" font-family="Plus Jakarta Sans, sans-serif">To Hampi, 142 km</text>
      <text x="20" y="40" fill="#94A3B8" font-size="10" font-weight="600" font-family="Plus Jakarta Sans, sans-serif">NH 48 Expressway &#x2022; Next stop 42 km</text>
      <!-- Right: Live GPS Status Dot -->
      <circle cx="340" cy="24" r="4" fill="#00E5FF" filter="url(#glow-cyan)" />
      <text x="352" y="27" fill="#00E5FF" font-size="10" font-weight="800" font-family="JetBrains Mono, monospace">GPS</text>
    </g>

    <!-- Draggable CoRoute Orbit Control FAB -->
    <g id="btn_orbit_fab" transform="translate(344, 360)">
      <circle cx="26" cy="26" r="26" fill="#0A0E17" stroke="#F59E0B" stroke-width="2.5"  />
      <!-- Orbital atom rings icon -->
      <g transform="translate(26, 26)">
        <ellipse rx="16" ry="7" fill="none" stroke="#F59E0B" stroke-width="2" transform="rotate(-30)" />
        <ellipse rx="16" ry="7" fill="none" stroke="#F59E0B" stroke-width="2" transform="rotate(30)" />
        <circle r="4" fill="#F59E0B" />
      </g>
    </g>

    <!-- Floating Right-Side Controls (MapSideControls: Brightness, Re-center, Sheet) -->
    <g id="Map_Side_Controls" transform="translate(352, 530)">
      <!-- 1. Screen On / Brightness -->
      <g id="btn_side_brightness" transform="translate(0, 0)">
        <circle cx="22" cy="22" r="22" fill="#0F172A" stroke="#334155" stroke-width="1.2"  />
        <circle cx="22" cy="22" r="6" fill="none" stroke="#F59E0B" stroke-width="2" />
        <line x1="22" y1="10" x2="22" y2="13" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" />
        <line x1="22" y1="31" x2="22" y2="34" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" />
      </g>
      <!-- 2. Re-Center on Me Crosshair (Active Cyan Glow) -->
      <g id="btn_side_recenter" transform="translate(0, 52)">
        <circle cx="22" cy="22" r="22" fill="#0F172A" stroke="#00E5FF" stroke-width="1.8" filter="url(#glow-cyan)"  />
        <circle cx="22" cy="22" r="7" fill="none" stroke="#00E5FF" stroke-width="2" />
        <circle cx="22" cy="22" r="2.5" fill="#00E5FF" />
        <line x1="22" y1="9" x2="22" y2="12" stroke="#00E5FF" stroke-width="2" />
        <line x1="22" y1="32" x2="22" y2="35" stroke="#00E5FF" stroke-width="2" />
        <line x1="9" y1="22" x2="12" y2="22" stroke="#00E5FF" stroke-width="2" />
        <line x1="32" y1="22" x2="35" y2="22" stroke="#00E5FF" stroke-width="2" />
      </g>
      <!-- 3. Open Ride Sheet Chevron -->
      <g id="btn_side_sheet" transform="translate(0, 104)">
        <circle cx="22" cy="22" r="22" fill="#0F172A" stroke="#334155" stroke-width="1.2"  />
        <path d="M15 25 L22 18 L29 25" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
      </g>
    </g>

    <!-- Hold-to-SOS Button (Always pinned bottom-left above collapsed sheet) -->
    <g id="btn_cockpit_sos" transform="translate(16, 686)">
      <circle cx="28" cy="28" r="28" fill="#DC2626" stroke="#EF4444" stroke-width="2" filter="url(#glow-sos)"  />
      <path d="M28 17 L39 37 H17 Z" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linejoin="round" />
      <line x1="28" y1="24" x2="28" y2="30" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" />
      <circle cx="28" cy="34" r="1.2" fill="#FFFFFF" />
      <text x="28" y="46" text-anchor="middle" fill="#FFFFFF" font-size="8" font-weight="900" font-family="Plus Jakarta Sans, sans-serif">SOS</text>
    </g>

    <!-- Collapsed Bottom Sheet: 2x2 Metric Strip Header -->
    <g id="Collapsed_Bottom_Sheet" transform="translate(0, 752)">
      <path d="M0 20 C0 8.954 8.954 0 20 0 H392 C403.046 0 412 8.954 412 20 V118 H0 Z" fill="#0F172A" stroke="#1E293B" stroke-width="1.2"  />
      <!-- Drag handle -->
      <rect x="188" y="8" width="36" height="4" rx="2" fill="#334155" />

      <!-- 4 Key Numbers (2x2 Grid) -->
      <g id="Metrics_2x2_Grid" transform="translate(24, 22)">
        <!-- 1. Remaining -->
        <g id="metric_remaining" transform="translate(0, 0)">
          <text x="0" y="24" fill="#FFFFFF" font-size="20" font-weight="900" font-family="Plus Jakarta Sans, sans-serif">142 km</text>
          <text x="0" y="38" fill="#94A3B8" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, sans-serif">left</text>
        </g>
        <line x1="88" y1="8" x2="88" y2="44" stroke="#1E293B" stroke-width="1" />

        <!-- 2. ETA -->
        <g id="metric_eta" transform="translate(100, 0)">
          <text x="0" y="24" fill="#FFFFFF" font-size="20" font-weight="900" font-family="Plus Jakarta Sans, sans-serif">4:35 PM</text>
          <text x="0" y="38" fill="#94A3B8" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, sans-serif">ETA</text>
        </g>
        <line x1="190" y1="8" x2="190" y2="44" stroke="#1E293B" stroke-width="1" />

        <!-- 3. Riding Count -->
        <g id="metric_riding" transform="translate(202, 0)">
          <text x="0" y="24" fill="#FFFFFF" font-size="20" font-weight="900" font-family="Plus Jakarta Sans, sans-serif">5/8</text>
          <text x="0" y="38" fill="#94A3B8" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, sans-serif">riding</text>
        </g>
        <line x1="264" y1="8" x2="264" y2="44" stroke="#1E293B" stroke-width="1" />

        <!-- 4. Spread -->
        <g id="metric_spread" transform="translate(276, 0)">
          <text x="0" y="24" fill="#FFFFFF" font-size="20" font-weight="900" font-family="Plus Jakarta Sans, sans-serif">2.1 km</text>
          <text x="0" y="38" fill="#94A3B8" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, sans-serif">spread</text>
        </g>
      </g>
    </g>

    <rect id="btn_modal_backdrop" width="412" height="870" fill="#000000" fill-opacity="0.6" />

    <!-- In-Cockpit Fuel Radar Modal Overlay -->
    <g id="InCockpit_Fuel_Modal" transform="translate(0, 180)">
      <path d="M0 28 C0 12.536 12.536 0 28 0 H384 C399.464 0 412 12.536 412 28 V690 H0 Z" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"  />
      <rect x="186" y="10" width="40" height="5" rx="2.5" fill="#334155" />

      <!-- Modal Header -->
      <g transform="translate(20, 24)">
        <text x="0" y="24" fill="#FFFFFF" font-size="18" font-weight="900" font-family="Plus Jakarta Sans, sans-serif">Fuel Estimation &amp; Radar</text>
        <text x="0" y="42" fill="#94A3B8" font-size="11" font-weight="500" font-family="Plus Jakarta Sans, sans-serif">Convoy tank ranges &amp; verified highway pumps</text>
        <g id="btn_close_popup">
          <rect x="312" y="6" width="60" height="34" rx="12" fill="#1E293B" stroke="#1E293B" stroke-width="1" />
          <text x="342" y="27" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700" font-family="Plus Jakarta Sans, sans-serif">Done</text>
        </g>
        <line x1="0" y1="52" x2="372" y2="52" stroke="#1E293B" stroke-width="1" />
      </g>

      <!-- Hero Range Card -->
      <g transform="translate(20, 92)">
        <rect width="372" height="114" rx="20" fill="#451A03" stroke="#F59E0B" stroke-width="1.8" />
        <text x="18" y="28" fill="#F59E0B" font-size="11" font-weight="800" font-family="Plus Jakarta Sans, sans-serif">YOUR USABLE TANK RANGE</text>
        <text x="18" y="68" fill="#FFFFFF" font-size="36" font-weight="900" font-family="JetBrains Mono, monospace">185</text>
        <text x="96" y="66" fill="#94A3B8" font-size="13" font-weight="700" font-family="JetBrains Mono, monospace">KM</text>
        <text x="18" y="94" fill="#34D399" font-size="11" font-weight="700" font-family="Plus Jakarta Sans, sans-serif">&#x2714; Destination Reachable (82 km remaining)</text>
      </g>

      <!-- Convoy Fuel Radar List -->
      <g transform="translate(20, 222)">
        <text x="0" y="16" fill="#94A3B8" font-size="11" font-weight="800" font-family="Plus Jakarta Sans, sans-serif">CONVOY TANK STATUS</text>
        
        <rect y="26" width="372" height="52" rx="14" fill="#0A0E17" stroke="#1E293B" stroke-width="1" />
        <text x="16" y="56" fill="#FFFFFF" font-size="12" font-weight="700" font-family="Plus Jakarta Sans, sans-serif">Lead SB (KTM 390 Adv)</text>
        <text x="356" y="56" text-anchor="end" fill="#34D399" font-size="12" font-weight="800" font-family="JetBrains Mono, monospace">185 km</text>

        <rect y="86" width="372" height="52" rx="14" fill="#0A0E17" stroke="#1E293B" stroke-width="1" />
        <text x="16" y="116" fill="#FFFFFF" font-size="12" font-weight="700" font-family="Plus Jakarta Sans, sans-serif">Rider VP (Himalayan 450)</text>
        <text x="356" y="116" text-anchor="end" fill="#34D399" font-size="12" font-weight="800" font-family="JetBrains Mono, monospace">210 km</text>

        <rect y="146" width="372" height="56" rx="14" fill="#451A03" stroke="#F59E0B" stroke-width="1.2" />
        <text x="16" y="174" fill="#F59E0B" font-size="12" font-weight="800" font-family="Plus Jakarta Sans, sans-serif">Sweeper RK (Low Fuel Deficit)</text>
        <text x="16" y="190" fill="#94A3B8" font-size="10" font-weight="500" font-family="Plus Jakarta Sans, sans-serif">Needs station before km 64</text>
        <text x="356" y="180" text-anchor="end" fill="#F59E0B" font-size="13" font-weight="900" font-family="JetBrains Mono, monospace">64 km &#x26A0;</text>
      </g>

      <!-- Broadcast Button -->
      <g id="btn_broadcast_refuel" transform="translate(20, 600)">
        <rect width="372" height="52" rx="16" fill="#F59E0B" />
        <text x="186" y="32" text-anchor="middle" fill="#070A0F" font-size="13" font-weight="900" font-family="Plus Jakarta Sans, sans-serif">BROADCAST REFUEL STOP TO CONVOY</text>
      </g>
    </g>
  </g>
</svg>