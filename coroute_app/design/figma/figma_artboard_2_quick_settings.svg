<svg width="412" height="870" viewBox="0 0 412 870" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-sos" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-amber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-red" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <clipPath id="screen-clip">
      <rect width="412" height="870" rx="36" fill="#070A0F" />
    </clipPath>
  </defs>
  <g id="CoRoute_Glove_Quick_Settings" clip-path="url(#screen-clip)">
    <rect width="412" height="870" fill="#0A0E17" />
    <!-- System Status Bar -->
    <g id="System_Status_Bar" transform="translate(24, 14)">
      <!-- Interactive Theme Toggle Button -->
      <g id="btn_theme_toggle">
        <rect x="0" y="0" width="76" height="22" rx="11" fill="#1E293B" stroke="#334155" stroke-width="1" />
        <text x="38" y="15" text-anchor="middle" fill="#00E5FF" font-size="10" font-weight="800" font-family="JetBrains Mono, monospace">DARK &#x21C4;</text>
      </g>
      <text x="94" y="16" fill="#94A3B8" font-size="12" font-weight="700" font-family="JetBrains Mono, monospace">12:40</text>
      <text x="296" y="16" fill="#00E5FF" font-size="11" font-weight="800" font-family="JetBrains Mono, monospace">5G</text>
      <text x="322" y="16" fill="#94A3B8" font-size="11" font-weight="700" font-family="JetBrains Mono, monospace">&#x25B2;&#x25B2;&#x25B2;</text>
      <text x="344" y="16" fill="#94A3B8" font-size="11" font-weight="700" font-family="JetBrains Mono, monospace">88%</text>
    </g>

    <!-- Header Frame -->
    <g id="Modal_Header" transform="translate(20, 48)">
      <text x="0" y="24" fill="#FFFFFF" font-size="20" font-weight="800" font-family="Plus Jakarta Sans, sans-serif">Glove Quick Settings</text>
      <text x="0" y="44" fill="#94A3B8" font-size="12" font-weight="500" font-family="Plus Jakarta Sans, sans-serif">High-contrast, large touch targets for riding gloves</text>
      <!-- Done Button -> Links to Screen 1 -->
      <g id="btn_close_settings">
        <rect x="312" y="4" width="60" height="36" rx="14" fill="#1E293B" stroke="#1E293B" stroke-width="1" />
        <text x="342" y="26" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700" font-family="Plus Jakarta Sans, sans-serif">Done</text>
      </g>
      <line x1="0" y1="58" x2="372" y2="58" stroke="#1E293B" stroke-width="1" />
    </g>

    <!-- Primary In-Flight Hero Actions (Prominent 74dp) -->
    <g id="Primary_InFlight_Actions" transform="translate(20, 126)">
      <!-- Action 1: Ride Guardian Link -> Links to Screen 3 -->
      <g id="btn_hero_guardian" transform="translate(0, 0)">
        <rect width="180" height="80" rx="20" fill="#083344" stroke="#00E5FF" stroke-width="2" filter="url(#glow-cyan)"  />
        <rect x="12" y="18" width="44" height="44" rx="14" fill="rgba(0,229,255,0.2)" />
        <path d="M28 40 L34 34 M30 32 L36 26" stroke="#00E5FF" stroke-width="2.5" stroke-linecap="round" />
        <text x="64" y="38" fill="#FFFFFF" font-size="13" font-weight="800" font-family="Plus Jakarta Sans, sans-serif">Guardian Link</text>
        <text x="64" y="54" fill="#00E5FF" font-size="10" font-weight="600" font-family="Plus Jakarta Sans, sans-serif">Share live track</text>
      </g>

      <!-- Action 2: Fuel / Range Sheet -> Links to Screen 4 -->
      <g id="btn_hero_fuel" transform="translate(192, 0)">
        <rect width="180" height="80" rx="20" fill="#451A03" stroke="#F59E0B" stroke-width="2"  />
        <rect x="12" y="18" width="44" height="44" rx="14" fill="rgba(245,158,11,0.2)" />
        <path d="M30 46 V30 H38 V46 M42 34 H44 V40 H42" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        <text x="64" y="38" fill="#FFFFFF" font-size="13" font-weight="800" font-family="Plus Jakarta Sans, sans-serif">Fuel / Range</text>
        <text x="64" y="54" fill="#FCD34D" font-size="10" font-weight="600" font-family="JetBrains Mono, monospace">185 km usable</text>
      </g>
    </g>

    <!-- 2x3 Glove Settings Grid -->
    <g id="Glove_Settings_Grid" transform="translate(20, 226)">
      <!-- Row 1: Voice Alerts & Speed Warning -->
      <g id="Tile_Voice_Alerts" transform="translate(0, 0)">
        <rect width="180" height="150" rx="20" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"  />
        <text x="14" y="30" fill="#FFFFFF" font-size="13" font-weight="800" font-family="Plus Jakarta Sans, sans-serif">Voice Alerts</text>
        <circle cx="164" cy="24" r="5" fill="#00E5FF" filter="url(#glow-cyan)" />
        <text x="14" y="60" fill="#94A3B8" font-size="11" font-weight="500" font-family="Plus Jakarta Sans, sans-serif">All turn cues and</text>
        <text x="14" y="76" fill="#94A3B8" font-size="11" font-weight="500" font-family="Plus Jakarta Sans, sans-serif">convoy distance cues</text>
        <rect x="14" y="96" width="152" height="40" rx="12" fill="#083344" stroke="#00E5FF" stroke-width="1" />
        <text x="90" y="121" text-anchor="middle" fill="#00E5FF" font-size="11" font-weight="800" font-family="JetBrains Mono, monospace">ALL ALERTS</text>
      </g>

      <g id="Tile_Speed_Warning" transform="translate(192, 0)">
        <rect width="180" height="150" rx="20" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"  />
        <text x="14" y="30" fill="#FFFFFF" font-size="13" font-weight="800" font-family="Plus Jakarta Sans, sans-serif">Speed Warning</text>
        <circle cx="164" cy="24" r="5" fill="#00E5FF" filter="url(#glow-cyan)" />
        <text x="14" y="60" fill="#94A3B8" font-size="11" font-weight="500" font-family="Plus Jakarta Sans, sans-serif">Audible alert at</text>
        <text x="14" y="76" fill="#94A3B8" font-size="11" font-weight="500" font-family="Plus Jakarta Sans, sans-serif">speed limit + 5 km/h</text>
        <rect x="14" y="96" width="152" height="40" rx="12" fill="#1E293B" stroke="#1E293B" stroke-width="1" />
        <text x="90" y="121" text-anchor="middle" fill="#00E5FF" font-size="11" font-weight="800" font-family="JetBrains Mono, monospace">80 KM/H</text>
      </g>

      <!-- Row 2: Essentials & Intercom VOX -->
      <g id="Tile_Essentials" transform="translate(0, 164)">
        <rect width="180" height="150" rx="20" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"  />
        <text x="14" y="30" fill="#FFFFFF" font-size="13" font-weight="800" font-family="Plus Jakarta Sans, sans-serif">Route Essentials</text>
        <circle cx="164" cy="24" r="5" fill="#00E676" />
        <text x="14" y="60" fill="#94A3B8" font-size="11" font-weight="500" font-family="Plus Jakarta Sans, sans-serif">Highway pumps &amp;</text>
        <text x="14" y="76" fill="#94A3B8" font-size="11" font-weight="500" font-family="Plus Jakarta Sans, sans-serif">emergency clinic POIs</text>
        <rect x="14" y="96" width="152" height="40" rx="12" fill="#1E293B" stroke="#1E293B" stroke-width="1" />
        <text x="90" y="121" text-anchor="middle" fill="#34D399" font-size="10" font-weight="800" font-family="JetBrains Mono, monospace">ACTIVE ON MAP</text>
      </g>

      <g id="Tile_Intercom_VOX" transform="translate(192, 164)">
        <rect width="180" height="150" rx="20" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"  />
        <text x="14" y="30" fill="#FFFFFF" font-size="13" font-weight="800" font-family="Plus Jakarta Sans, sans-serif">Intercom VOX</text>
        <circle cx="164" cy="24" r="5" fill="#94A3B8" />
        <text x="14" y="60" fill="#94A3B8" font-size="11" font-weight="500" font-family="Plus Jakarta Sans, sans-serif">Voice-activated</text>
        <text x="14" y="76" fill="#94A3B8" font-size="11" font-weight="500" font-family="Plus Jakarta Sans, sans-serif">helmet microphone</text>
        <rect x="14" y="96" width="152" height="40" rx="12" fill="#1E293B" stroke="#1E293B" stroke-width="1" />
        <text x="90" y="121" text-anchor="middle" fill="#94A3B8" font-size="10" font-weight="800" font-family="JetBrains Mono, monospace">STANDBY (MUTE)</text>
      </g>

      <!-- Row 3: Regroup Cues & Screen Awake -->
      <g id="Tile_Regroup" transform="translate(0, 328)">
        <rect width="180" height="150" rx="20" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"  />
        <text x="14" y="30" fill="#FFFFFF" font-size="13" font-weight="800" font-family="Plus Jakarta Sans, sans-serif">Convoy Regroup</text>
        <circle cx="164" cy="24" r="5" fill="#00E5FF" filter="url(#glow-cyan)" />
        <text x="14" y="60" fill="#94A3B8" font-size="11" font-weight="500" font-family="Plus Jakarta Sans, sans-serif">Audible cue when</text>
        <text x="14" y="76" fill="#94A3B8" font-size="11" font-weight="500" font-family="Plus Jakarta Sans, sans-serif">pack gap &gt; 1.5 km</text>
        <rect x="14" y="96" width="152" height="40" rx="12" fill="#1E293B" stroke="#1E293B" stroke-width="1" />
        <text x="90" y="121" text-anchor="middle" fill="#00E5FF" font-size="11" font-weight="800" font-family="JetBrains Mono, monospace">1,500 METERS</text>
      </g>

      <g id="Tile_Screen_Awake" transform="translate(192, 328)">
        <rect width="180" height="150" rx="20" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"  />
        <text x="14" y="30" fill="#FFFFFF" font-size="13" font-weight="800" font-family="Plus Jakarta Sans, sans-serif">Keep Screen On</text>
        <circle cx="164" cy="24" r="5" fill="#00E5FF" filter="url(#glow-cyan)" />
        <text x="14" y="60" fill="#94A3B8" font-size="11" font-weight="500" font-family="Plus Jakarta Sans, sans-serif">Locks display awake</text>
        <text x="14" y="76" fill="#94A3B8" font-size="11" font-weight="500" font-family="Plus Jakarta Sans, sans-serif">for handlebar mounts</text>
        <rect x="14" y="96" width="152" height="40" rx="12" fill="#083344" stroke="#00E5FF" stroke-width="1" />
        <text x="90" y="121" text-anchor="middle" fill="#00E5FF" font-size="11" font-weight="800" font-family="JetBrains Mono, monospace">LOCKED AWAKE</text>
      </g>
    </g>

    <!-- Bottom Full Settings Link -> Links to Screen 5: Group Settings -->
    <g id="btn_open_group_settings" transform="translate(20, 780)">
      <rect width="372" height="52" rx="16" fill="#0F172A" stroke="#00E5FF" stroke-width="1.5"  />
      <text x="186" y="32" text-anchor="middle" fill="#00E5FF" font-size="13" font-weight="800" font-family="Plus Jakarta Sans, sans-serif">Open Full Group Settings Sheet &#x2192;</text>
    </g>
  </g>
</svg>