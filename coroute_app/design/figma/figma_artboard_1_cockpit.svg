<svg width="412" height="870" viewBox="0 0 412 870" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-sos" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-amber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-red" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <clipPath id="screen-clip">
      <rect width="412" height="870" rx="36" fill="#070A0F" />
    </clipPath>
  </defs>
  <g id="CoRoute_Live_Cockpit_Screen" clip-path="url(#screen-clip)">
    <rect width="412" height="870" fill="#070A0F" />

    <!-- Vector Map Grid (Background) -->
    <g id="Map_Network" opacity="0.95">
      <rect width="412" height="870" fill="#0A0E17" />
      <path d="M-20 220 H432" stroke="#162235" stroke-width="8" />
      <path d="M-20 460 H432" stroke="#162235" stroke-width="10" />
      <path d="M140 -20 V890" stroke="#162235" stroke-width="8" />
      <path d="M300 -20 V890" stroke="#162235" stroke-width="8" />
      <path d="M-20 620 Q160 400 432 540" stroke="#162235" stroke-width="16" />

      <text x="32" y="200" fill="#475569" font-size="11" font-weight="700" font-family="JetBrains Mono, monospace">NH 48 EXPRESSWAY</text>
      <text x="32" y="440" fill="#475569" font-size="11" font-weight="700" font-family="JetBrains Mono, monospace">NICE ROAD INTERCHANGE</text>
      <text x="150" y="320" fill="#334155" font-size="10" font-weight="600" font-family="Plus Jakarta Sans, sans-serif">ELECTRONICS CITY</text>

      <!-- Active Navigation Guidance Polyline -->
      <path d="M70 660 Q140 540 190 460 T290 320 L330 180" stroke="#00E5FF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow-cyan)" />
      <path d="M70 660 Q140 540 190 460 T290 320 L330 180" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 7" opacity="0.9" />

      <!-- Convoy Marker: Sweeper RK -->
      <g id="Marker_Sweeper_RK" transform="translate(68, 656)">
        <circle r="16" fill="#0F172A" stroke="#FF9100" stroke-width="3" />
        <text y="4" text-anchor="middle" fill="#FF9100" font-size="11" font-weight="700" font-family="JetBrains Mono, monospace">RK</text>
        <rect x="-24" y="20" width="48" height="14" rx="4" fill="#0F172A" stroke="#FF9100" stroke-width="1" />
        <text y="30" text-anchor="middle" fill="#FF9100" font-size="8" font-weight="700" font-family="Plus Jakarta Sans, sans-serif">SWEEPER</text>
      </g>

      <!-- Convoy Marker: Pack VP -->
      <g id="Marker_Pack_VP" transform="translate(188, 456)">
        <circle r="15" fill="#0F172A" stroke="#00E676" stroke-width="2.5" />
        <text y="4" text-anchor="middle" fill="#00E676" font-size="11" font-weight="700" font-family="JetBrains Mono, monospace">VP</text>
        <rect x="-18" y="19" width="36" height="14" rx="4" fill="#0F172A" stroke="#00E676" stroke-width="1" />
        <text y="29" text-anchor="middle" fill="#00E676" font-size="8" font-weight="700" font-family="Plus Jakarta Sans, sans-serif">PACK</text>
      </g>

      <!-- Convoy Marker: Lead SB -->
      <g id="Marker_Lead_SB" transform="translate(328, 176)">
        <circle r="22" fill="rgba(0,229,255,0.25)" />
        <circle r="17" fill="#0F172A" stroke="#00E5FF" stroke-width="3" />
        <text y="4" text-anchor="middle" fill="#00E5FF" font-size="12" font-weight="800" font-family="JetBrains Mono, monospace">SB</text>
        <rect x="-20" y="-34" width="40" height="15" rx="4" fill="#00E5FF" />
        <text y="-23" text-anchor="middle" fill="#070A0F" font-size="9" font-weight="800" font-family="Plus Jakarta Sans, sans-serif">LEAD</text>
      </g>
    </g>

    <!-- System Status Bar -->
    <g id="System_Status_Bar" transform="translate(24, 14)">
      <!-- Interactive Theme Toggle Button -->
      <g id="btn_theme_toggle">
        <rect x="0" y="0" width="76" height="22" rx="11" fill="#1E293B" stroke="#334155" stroke-width="1" />
        <text x="38" y="15" text-anchor="middle" fill="#00E5FF" font-size="10" font-weight="800" font-family="JetBrains Mono, monospace">DARK &#x21C4;</text>
      </g>
      <text x="94" y="16" fill="#94A3B8" font-size="12" font-weight="700" font-family="JetBrains Mono, monospace">12:40</text>
      <text x="296" y="16" fill="#00E5FF" font-size="11" font-weight="800" font-family="JetBrains Mono, monospace">5G</text>
      <text x="322" y="16" fill="#94A3B8" font-size="11" font-weight="700" font-family="JetBrains Mono, monospace">&#x25B2;&#x25B2;&#x25B2;</text>
      <text x="344" y="16" fill="#94A3B8" font-size="11" font-weight="700" font-family="JetBrains Mono, monospace">88%</text>
    </g>

    <!-- Top Turn-by-Turn HUD Card -->
    <g id="Top_Guidance_HUD" transform="translate(16, 48)">
      <rect width="380" height="74" rx="24" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"  />
      <rect x="14" y="13" width="48" height="48" rx="16" fill="rgba(0,229,255,0.15)" stroke="#00E5FF" stroke-width="1.2" />
      <path d="M38 24 L38 48 M38 24 L30 32 M38 24 L46 32" stroke="#00E5FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <text x="74" y="34" fill="#FFFFFF" font-size="14" font-weight="800" font-family="Plus Jakarta Sans, sans-serif">In 800 m <tspan fill="#94A3B8">&#x2022;</tspan> Keep Right</text>
      <text x="74" y="52" fill="#94A3B8" font-size="11" font-weight="500" font-family="Plus Jakarta Sans, sans-serif">NH 48 Expressway &#x2022; Toward Hosur</text>
      <line x1="290" y1="12" x2="290" y2="62" stroke="#1E293B" stroke-width="1" />
      <text x="332" y="38" text-anchor="middle" fill="#FFFFFF" font-size="28" font-weight="800" font-family="JetBrains Mono, monospace">68</text>
      <text x="364" y="30" fill="#94A3B8" font-size="10" font-weight="700" font-family="JetBrains Mono, monospace">KM/H</text>
      <rect x="298" y="44" width="70" height="18" rx="6" fill="#064E3B" stroke="#059669" stroke-width="0.8" />
      <text x="333" y="56" text-anchor="middle" fill="#34D399" font-size="9" font-weight="800" font-family="JetBrains Mono, monospace">LIMIT 80</text>
    </g>

    <!-- Bottom Controls Layer -->
    <g id="Bottom_Cockpit_Controls" transform="translate(0, 680)">
      <!-- Glance Row: SOS + Shortcuts Dock + Recenter -->
      <g id="Dock_Row" transform="translate(16, 0)">
        <!-- 56dp Large Glove SOS Button -->
        <g id="btn_dock_sos">
          <rect width="56" height="56" rx="18" fill="#DC2626" stroke="#EF4444" stroke-width="1.5" filter="url(#glow-sos)"  />
          <text x="28" y="28" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="800" font-family="Plus Jakarta Sans, sans-serif">SOS</text>
          <text x="28" y="42" text-anchor="middle" fill="#FFFFFF" opacity="0.9" font-size="8" font-weight="700" font-family="JetBrains Mono, monospace">HOLD 3s</text>
        </g>

        <!-- Streamlined Shortcuts Dock Frame (5 Direct Shortcut Targets) -->
        <g id="Shortcuts_Dock" transform="translate(68, 0)">
          <rect width="256" height="56" rx="18" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"  />

          <!-- 1. Stop Reason Button -> Links to Screen 6 -->
          <g id="btn_dock_stop" transform="translate(6, 6)">
            <rect width="46" height="44" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1" />
            <text x="23" y="26" text-anchor="middle" fill="#FBBF24" font-size="10" font-weight="800" font-family="JetBrains Mono, monospace">STOP</text>
          </g>

          <!-- 2. Ride Guardian Link -> Links to Screen 3 -->
          <g id="btn_dock_guardian" transform="translate(56, 6)">
            <rect width="46" height="44" rx="12" fill="rgba(0,229,255,0.15)" stroke="#00E5FF" stroke-width="1.4" />
            <text x="23" y="26" text-anchor="middle" fill="#00E5FF" font-size="10" font-weight="900" font-family="JetBrains Mono, monospace">LINK</text>
          </g>

          <!-- 3. Fuel Range Radar -> Links to Screen 4 -->
          <g id="btn_dock_fuel" transform="translate(106, 6)">
            <rect width="46" height="44" rx="12" fill="#451A03" stroke="#F59E0B" stroke-width="1.2" />
            <text x="23" y="26" text-anchor="middle" fill="#FCD34D" font-size="10" font-weight="800" font-family="JetBrains Mono, monospace">185k</text>
          </g>

          <!-- 4. Voice Mic Mode Toggle -->
          <g id="btn_dock_mic" transform="translate(156, 6)">
            <rect width="44" height="44" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1" />
            <text x="22" y="26" text-anchor="middle" fill="#00E5FF" font-size="10" font-weight="800" font-family="JetBrains Mono, monospace">MIC</text>
          </g>

          <!-- 5. Glove Quick Settings Button -> Links to Screen 2 -->
          <g id="btn_dock_settings" transform="translate(204, 6)">
            <rect width="44" height="44" rx="12" fill="#1E293B" stroke="#00E5FF" stroke-width="1.2" />
            <text x="22" y="26" text-anchor="middle" fill="#00E5FF" font-size="10" font-weight="900" font-family="JetBrains Mono, monospace">CFG</text>
          </g>
        </g>

        <!-- Recenter Map Button -->
        <g id="btn_dock_recenter" transform="translate(332, 0)">
          <rect width="48" height="56" rx="18" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"  />
          <circle cx="24" cy="28" r="8" stroke="#94A3B8" stroke-width="2" />
          <circle cx="24" cy="28" r="3" fill="#00E5FF" />
        </g>
      </g>

      <!-- Collapsed Bottom Sheet -->
      <g id="Collapsed_Bottom_Sheet" transform="translate(0, 68)">
        <path d="M0 24 C0 10.745 10.745 0 24 0 H388 C401.255 0 412 10.745 412 24 V130 H0 Z" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"  />
        <rect x="186" y="8" width="40" height="5" rx="2.5" fill="#334155" />

        <!-- Convoy Header Row -> Links to Screen 5: Group Settings -->
        <g id="btn_convoy_header">
          <text x="20" y="38" fill="#FFFFFF" font-size="13" font-weight="800" font-family="Plus Jakarta Sans, sans-serif">Bangalore Highway Convoy</text>
          <rect x="180" y="24" width="60" height="18" rx="9" fill="rgba(0,229,255,0.15)" stroke="#00E5FF" stroke-width="0.8" />
          <text x="210" y="36" text-anchor="middle" fill="#00E5FF" font-size="9" font-weight="800" font-family="Plus Jakarta Sans, sans-serif">3 Riders</text>
          <text x="392" y="38" text-anchor="end" fill="#94A3B8" font-size="11" font-weight="700" font-family="JetBrains Mono, monospace">ETA 14:15 &#x2022; 82 km</text>
        </g>

        <!-- Live Fuel & Guardian Status Strip -> Links to Screen 4: Fuel Radar -->
        <g id="btn_fuel_strip" transform="translate(16, 50)">
          <rect width="380" height="42" rx="14" fill="#070A0F" stroke="#1E293B" stroke-width="1" />
          <circle cx="16" cy="21" r="5" fill="#F59E0B" />
          <text x="28" y="25" fill="#CBD5E1" font-size="11" font-weight="600" font-family="Plus Jakarta Sans, sans-serif">Usable Range: <tspan fill="#FFFFFF" font-weight="800" font-family="JetBrains Mono, monospace">185 km</tspan></text>
          <path d="M260 21 L270 21 M263 17 L267 25" stroke="#00E5FF" stroke-width="1.8" stroke-linecap="round" />
          <text x="364" y="25" text-anchor="end" fill="#00E5FF" font-size="11" font-weight="800" font-family="Plus Jakarta Sans, sans-serif">Guardian Active</text>
        </g>
      </g>
    </g>
  </g>
</svg>