<svg width="412" height="870" viewBox="0 0 412 870" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-sos" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-amber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-orbit" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <clipPath id="screen-clip">
      <rect width="412" height="870" rx="36" fill="#070A0F" />
    </clipPath>
  </defs>
  <g id="CoRoute_Popup_Guardian_Dark" clip-path="url(#screen-clip)">
    <!-- Background Canvas -->
    <rect width="412" height="870" fill="#070A0F" />

    <!-- Vector Map Grid (Background) -->
    <g id="Map_Network" opacity="0.95">
      <rect width="412" height="870" fill="#0A0E17" />
      <path d="M-20 220 H432" stroke="#162235" stroke-width="8" />
      <path d="M-20 460 H432" stroke="#162235" stroke-width="10" />
      <path d="M140 -20 V890" stroke="#162235" stroke-width="8" />
      <path d="M300 -20 V890" stroke="#162235" stroke-width="8" />
      <path d="M-20 620 Q160 400 432 540" stroke="#162235" stroke-width="16" />

      <text x="32" y="200" fill="#475569" font-size="11" font-weight="700" font-family="JetBrains Mono, monospace">NH 48 EXPRESSWAY</text>
      <text x="32" y="440" fill="#475569" font-size="11" font-weight="700" font-family="JetBrains Mono, monospace">NICE ROAD INTERCHANGE</text>

      <!-- Active Navigation Guidance Polyline -->
      <path d="M70 660 Q140 540 190 460 T290 320 L330 180" stroke="#00E5FF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow-cyan)" />
      <path d="M70 660 Q140 540 190 460 T290 320 L330 180" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 7" opacity="0.9" />

      <!-- Convoy Marker 1: Sweeper RK with Live Speed Badge -->
      <g id="Marker_Sweeper_RK" transform="translate(68, 646)">
        <circle r="16" fill="#0F172A" stroke="#FF9100" stroke-width="3" />
        <text y="4" text-anchor="middle" fill="#FF9100" font-size="11" font-weight="700" font-family="JetBrains Mono, monospace">RK</text>
        <rect x="-38" y="20" width="76" height="16" rx="5" fill="#0F172A" stroke="#FF9100" stroke-width="1" />
        <text y="32" text-anchor="middle" fill="#FF9100" font-size="8" font-weight="800" font-family="JetBrains Mono, monospace">RK &#x2022; 64 KM/H</text>
      </g>

      <!-- Convoy Marker 2: Pack VP with Live Speed Badge -->
      <g id="Marker_Pack_VP" transform="translate(188, 446)">
        <circle r="16" fill="#0F172A" stroke="#00E676" stroke-width="2.5" />
        <text y="4" text-anchor="middle" fill="#00E676" font-size="11" font-weight="700" font-family="JetBrains Mono, monospace">VP</text>
        <rect x="-38" y="20" width="76" height="16" rx="5" fill="#0F172A" stroke="#00E676" stroke-width="1" />
        <text y="32" text-anchor="middle" fill="#00E676" font-size="8" font-weight="800" font-family="JetBrains Mono, monospace">VP &#x2022; 68 KM/H</text>
      </g>

      <!-- Convoy Marker 3: Lead SB with Live Speed Badge -->
      <g id="Marker_Lead_SB" transform="translate(328, 176)">
        <circle r="22" fill="rgba(0,229,255,0.25)" />
        <circle r="17" fill="#0F172A" stroke="#00E5FF" stroke-width="3" />
        <text y="4" text-anchor="middle" fill="#00E5FF" font-size="12" font-weight="800" font-family="JetBrains Mono, monospace">SB</text>
        <rect x="-38" y="-34" width="76" height="16" rx="5" fill="#00E5FF" />
        <text y="-22" text-anchor="middle" fill="#070A0F" font-size="8.5" font-weight="900" font-family="JetBrains Mono, monospace">SB &#x2022; 72 KM/H</text>
      </g>
    </g>

    <!-- System Status Bar -->
    <g id="System_Status_Bar" transform="translate(24, 14)">
      <!-- Interactive Theme Toggle Button -->
      <g id="btn_theme_toggle">
        <rect x="0" y="0" width="76" height="22" rx="11" fill="#1E293B" stroke="#334155" stroke-width="1" />
        <text x="38" y="15" text-anchor="middle" fill="#00E5FF" font-size="10" font-weight="800" font-family="JetBrains Mono, monospace">DARK &#x21C4;</text>
      </g>
      <text x="94" y="16" fill="#94A3B8" font-size="12" font-weight="700" font-family="JetBrains Mono, monospace">12:40</text>
      <text x="296" y="16" fill="#00E5FF" font-size="11" font-weight="800" font-family="JetBrains Mono, monospace">5G</text>
      <text x="322" y="16" fill="#94A3B8" font-size="11" font-weight="700" font-family="JetBrains Mono, monospace">&#x25B2;&#x25B2;&#x25B2;</text>
      <text x="344" y="16" fill="#94A3B8" font-size="11" font-weight="700" font-family="JetBrains Mono, monospace">88%</text>
    </g>

    <!-- Top Turn-by-Turn HUD Card -->
    <g id="Top_Guidance_HUD" transform="translate(16, 48)">
      <rect width="380" height="74" rx="24" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"  />
      <rect x="14" y="13" width="48" height="48" rx="16" fill="rgba(0,229,255,0.15)" stroke="#00E5FF" stroke-width="1.2" />
      <path d="M38 24 L38 48 M38 24 L30 32 M38 24 L46 32" stroke="#00E5FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <text x="74" y="34" fill="#FFFFFF" font-size="14" font-weight="800" font-family="Plus Jakarta Sans, sans-serif">In 800 m <tspan fill="#94A3B8">&#x2022;</tspan> Keep Right</text>
      <text x="74" y="52" fill="#94A3B8" font-size="11" font-weight="500" font-family="Plus Jakarta Sans, sans-serif">NH 48 Expressway &#x2022; Toward Hosur</text>
      <line x1="290" y1="12" x2="290" y2="62" stroke="#1E293B" stroke-width="1" />
      <text x="332" y="38" text-anchor="middle" fill="#FFFFFF" font-size="28" font-weight="800" font-family="JetBrains Mono, monospace">68</text>
      <text x="364" y="30" fill="#94A3B8" font-size="10" font-weight="700" font-family="JetBrains Mono, monospace">KM/H</text>
      <rect x="298" y="44" width="70" height="18" rx="6" fill="#064E3B" stroke="#059669" stroke-width="0.8" />
      <text x="333" y="56" text-anchor="middle" fill="#34D399" font-size="9" font-weight="800" font-family="JetBrains Mono, monospace">LIMIT 80</text>
    </g>

    <!-- Draggable CoRoute Orbit Control FAB -->
    <g id="btn_orbit_fab" transform="translate(344, 360)">
      <circle cx="26" cy="26" r="26" fill="#0A0E17" stroke="#F59E0B" stroke-width="2.5"  />
      <!-- Orbital atom rings icon -->
      <g transform="translate(26, 26)">
        <ellipse rx="16" ry="7" fill="none" stroke="#F59E0B" stroke-width="2" transform="rotate(-30)" />
        <ellipse rx="16" ry="7" fill="none" stroke="#F59E0B" stroke-width="2" transform="rotate(30)" />
        <circle r="4" fill="#F59E0B" />
      </g>
    </g>

    <!-- Bottom Controls Layer -->
    <g id="Bottom_Cockpit_Controls" transform="translate(0, 680)">
      <!-- Glance Row: SOS + 5 Dock Shortcuts (MIC, STOP, FUEL, LINK, MORE) -->
      <g id="Dock_Row" transform="translate(16, 0)">
        <!-- 1. SOS Button -->
        <g id="btn_dock_sos">
          <rect width="56" height="56" rx="18" fill="#DC2626" stroke="#EF4444" stroke-width="1.5" filter="url(#glow-sos)"  />
          <!-- Triangle warning icon -->
          <path d="M28 16 L40 38 H16 Z" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linejoin="round" />
          <line x1="28" y1="24" x2="28" y2="30" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" />
          <circle cx="28" cy="34" r="1.2" fill="#FFFFFF" />
          <text x="28" y="48" text-anchor="middle" fill="#FFFFFF" font-size="9" font-weight="800" font-family="Plus Jakarta Sans, sans-serif">SOS</text>
        </g>

        <!-- Shortcuts Dock Frame -->
        <g id="Shortcuts_Dock" transform="translate(66, 0)">
          <rect width="314" height="56" rx="18" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"  />

          <!-- 2. MIC Button -->
          <g id="btn_dock_mic" transform="translate(6, 6)">
            <rect width="56" height="44" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1" />
            <path d="M28 14 V24 M24 18 C24 22 32 22 32 18" stroke="#00E5FF" stroke-width="2" stroke-linecap="round" />
            <text x="28" y="34" text-anchor="middle" fill="#00E5FF" font-size="9" font-weight="800" font-family="JetBrains Mono, monospace">MIC</text>
          </g>

          <!-- 3. STOP Button -> Links to Stop Picker Popup -->
          <g id="btn_dock_stop" transform="translate(68, 6)">
            <rect width="56" height="44" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1" />
            <rect x="22" y="14" width="12" height="12" rx="3" stroke="#FBBF24" stroke-width="2" fill="none" />
            <text x="28" y="34" text-anchor="middle" fill="#FBBF24" font-size="9" font-weight="800" font-family="JetBrains Mono, monospace">STOP</text>
          </g>

          <!-- 4. FUEL Button -> Links to Fuel Radar Popup -->
          <g id="btn_dock_fuel" transform="translate(130, 6)">
            <rect width="56" height="44" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1" />
            <path d="M24 26 V16 H30 V26 M32 18 H34 V22 H32" stroke="#00E5FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
            <text x="28" y="34" text-anchor="middle" fill="#00E5FF" font-size="9" font-weight="800" font-family="JetBrains Mono, monospace">FUEL</text>
          </g>

          <!-- 5. LINK Button -> Links to Guardian Link Popup -->
          <g id="btn_dock_guardian" transform="translate(192, 6)">
            <rect width="56" height="44" rx="12" fill="rgba(0,229,255,0.15)" stroke="#00E5FF" stroke-width="1.3" />
            <path d="M24 22 L28 18 M26 17 L30 13" stroke="#00E5FF" stroke-width="2" stroke-linecap="round" />
            <text x="28" y="34" text-anchor="middle" fill="#00E5FF" font-size="9" font-weight="900" font-family="JetBrains Mono, monospace">LINK</text>
          </g>

          <!-- 6. MORE Button -> Links to Glove Quick Settings Popup -->
          <g id="btn_dock_more" transform="translate(254, 6)">
            <rect width="54" height="44" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1" />
            <rect x="23" y="14" width="4" height="4" rx="1" fill="#00E5FF" />
            <rect x="29" y="14" width="4" height="4" rx="1" fill="#00E5FF" />
            <rect x="23" y="20" width="4" height="4" rx="1" fill="#00E5FF" />
            <rect x="29" y="20" width="4" height="4" rx="1" fill="#00E5FF" />
            <text x="27" y="34" text-anchor="middle" fill="#00E5FF" font-size="9" font-weight="800" font-family="JetBrains Mono, monospace">MORE</text>
          </g>
        </g>
      </g>

      <!-- Collapsed Bottom Sheet -->
      <g id="Collapsed_Bottom_Sheet" transform="translate(0, 68)">
        <path d="M0 24 C0 10.745 10.745 0 24 0 H388 C401.255 0 412 10.745 412 24 V130 H0 Z" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"  />
        <rect x="186" y="8" width="40" height="5" rx="2.5" fill="#334155" />

        <!-- Convoy Header Row -> Links to Screen 5: Group Settings -->
        <g id="btn_convoy_header">
          <text x="20" y="38" fill="#FFFFFF" font-size="13" font-weight="800" font-family="Plus Jakarta Sans, sans-serif">Bangalore Highway Convoy</text>
          <rect x="180" y="24" width="60" height="18" rx="9" fill="rgba(0,229,255,0.15)" stroke="#00E5FF" stroke-width="0.8" />
          <text x="210" y="36" text-anchor="middle" fill="#00E5FF" font-size="9" font-weight="800" font-family="Plus Jakarta Sans, sans-serif">3 Riders</text>
          <text x="392" y="38" text-anchor="end" fill="#94A3B8" font-size="11" font-weight="700" font-family="JetBrains Mono, monospace">ETA 14:15 &#x2022; 82 km</text>
        </g>

        <!-- Live Fuel & Guardian Status Strip -> Links to Screen 4: Fuel Radar -->
        <g id="btn_fuel_strip" transform="translate(16, 50)">
          <rect width="380" height="42" rx="14" fill="#070A0F" stroke="#1E293B" stroke-width="1" />
          <circle cx="16" cy="21" r="5" fill="#F59E0B" />
          <text x="28" y="25" fill="#CBD5E1" font-size="11" font-weight="600" font-family="Plus Jakarta Sans, sans-serif">Usable Range: <tspan fill="#FFFFFF" font-weight="800" font-family="JetBrains Mono, monospace">185 km</tspan></text>
          <path d="M260 21 L270 21 M263 17 L267 25" stroke="#00E5FF" stroke-width="1.8" stroke-linecap="round" />
          <text x="364" y="25" text-anchor="end" fill="#00E5FF" font-size="11" font-weight="800" font-family="Plus Jakarta Sans, sans-serif">Guardian Active</text>
        </g>
      </g>
    </g>

    <rect id="btn_modal_backdrop" width="412" height="870" fill="#000000" fill-opacity="0.6" />

    <!-- In-Cockpit Ride Guardian Modal Overlay -->
    <g id="InCockpit_Guardian_Modal" transform="translate(0, 220)">
      <path d="M0 28 C0 12.536 12.536 0 28 0 H384 C399.464 0 412 12.536 412 28 V650 H0 Z" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"  />
      <rect x="186" y="10" width="40" height="5" rx="2.5" fill="#334155" />

      <!-- Modal Header -->
      <g transform="translate(20, 24)">
        <text x="0" y="24" fill="#FFFFFF" font-size="18" font-weight="900" font-family="Plus Jakarta Sans, sans-serif">Ride Guardian Link</text>
        <text x="0" y="42" fill="#94A3B8" font-size="11" font-weight="500" font-family="Plus Jakarta Sans, sans-serif">Zero-install live tracking for family &amp; monitors</text>
        <g id="btn_close_popup">
          <rect x="312" y="6" width="60" height="34" rx="12" fill="#1E293B" stroke="#1E293B" stroke-width="1" />
          <text x="342" y="27" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700" font-family="Plus Jakarta Sans, sans-serif">Done</text>
        </g>
        <line x1="0" y1="52" x2="372" y2="52" stroke="#1E293B" stroke-width="1" />
      </g>

      <!-- Security Trust Banner -->
      <g transform="translate(20, 92)">
        <rect width="372" height="96" rx="20" fill="#083344" stroke="#00E5FF" stroke-width="1.5" />
        <text x="18" y="28" fill="#00E5FF" font-size="11" font-weight="800" font-family="Plus Jakarta Sans, sans-serif" letter-spacing="1">ZERO APP INSTALL REQUIRED</text>
        <text x="18" y="52" fill="#FFFFFF" font-size="12" font-weight="500" font-family="Plus Jakarta Sans, sans-serif">Family can watch convoy live progress in any browser.</text>
        <text x="18" y="78" fill="#00E5FF" font-size="10.5" font-weight="700" font-family="JetBrains Mono, monospace">&#x2714; 24h Expiry &#x2022; Read-Only Telemetry</text>
      </g>

      <!-- URL Link Box -->
      <g transform="translate(20, 204)">
        <rect width="372" height="140" rx="20" fill="#0A0E17" stroke="#1E293B" stroke-width="1" />
        <text x="18" y="28" fill="#94A3B8" font-size="11" font-weight="800" font-family="Plus Jakarta Sans, sans-serif">LIVE WEB LINK</text>
        <rect x="18" y="40" width="336" height="40" rx="12" fill="#070A0F" stroke="#1E293B" stroke-width="1" />
        <text x="30" y="65" fill="#00E5FF" font-size="10.5" font-weight="600" font-family="JetBrains Mono, monospace">https://coroute.duckdns.org/watch/gd_9b3f7a18c2</text>
        
        <g id="btn_copy_link" transform="translate(18, 90)">
          <rect width="162" height="40" rx="12" fill="#00E5FF" />
          <text x="81" y="25" text-anchor="middle" fill="#070A0F" font-size="12" font-weight="800" font-family="Plus Jakarta Sans, sans-serif">Copy Link</text>
        </g>
        <g id="btn_share_family" transform="translate(192, 90)">
          <rect width="162" height="40" rx="12" fill="#1E293B" stroke="#1E293B" stroke-width="1" />
          <text x="81" y="25" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700" font-family="Plus Jakarta Sans, sans-serif">Share with Family</text>
        </g>
      </g>

      <!-- Observers Active -->
      <g transform="translate(20, 360)">
        <rect width="372" height="64" rx="16" fill="#0A0E17" stroke="#1E293B" stroke-width="1" />
        <circle cx="28" cy="32" r="5" fill="#00E676" />
        <text x="44" y="28" fill="#FFFFFF" font-size="12" font-weight="700" font-family="Plus Jakarta Sans, sans-serif">Mom &amp; Family (Home)</text>
        <text x="44" y="44" fill="#94A3B8" font-size="10" font-weight="500" font-family="Plus Jakarta Sans, sans-serif">Viewing via Mobile Chrome</text>
        <text x="352" y="36" text-anchor="end" fill="#00E5FF" font-size="11" font-weight="800" font-family="JetBrains Mono, monospace">LIVE</text>
      </g>

      <!-- Return Button -->
      <g id="btn_return_cockpit" transform="translate(20, 560)">
        <rect width="372" height="52" rx="16" fill="#00E5FF" />
        <text x="186" y="32" text-anchor="middle" fill="#070A0F" font-size="13" font-weight="800" font-family="Plus Jakarta Sans, sans-serif">RETURN TO COCKPIT MAP</text>
      </g>
    </g>
  </g>
</svg>